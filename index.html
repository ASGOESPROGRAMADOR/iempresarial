), commercial papers (art. 45)."], "txt": "<b>Debênture (art. 52):<\/b> é um <b>título de dívida<\/b>. A companhia toma dinheiro emprestado do público e promete pagar com juros. Quem compra é <b>credor<\/b>, não é dono. Por isso recebe <b>juros<\/b>, e não dividendo, e não vota na assembleia.\n<b>Garantias e tipos (art. 58):<\/b> com garantia real, flutuante, quirografária ou subordinada. Podem ser <b>conversíveis em ações<\/b>.\n<b>Quem emite:<\/b> companhia aberta ou fechada, mas a emissão pública exige registro na CVM.\n<b>Escritura e agente fiduciário (art. 61 e 66):<\/b> a emissão é regida por uma escritura, e o <b>agente fiduciário<\/b> representa os debenturistas e defende seus interesses.\n<b>Outros valores mobiliários:<\/b> <b>partes beneficiárias<\/b> (títulos sem valor nominal e estranhos ao capital, que dão direito de crédito eventual sobre os lucros, art. 46) e <b>bônus de subscrição<\/b> (que dão direito de subscrever ações em futuro aumento de capital, art. 75). A <b>nota promissória para distribuição pública (commercial paper)<\/b> tem regras da CVM.\n<b>Assembleia de debenturistas (art. 71):<\/b> os debenturistas da mesma emissão podem se reunir para deliberar sobre seus interesses comuns."}, {"id": "49", "t": "Fusão, incorporação e cisão nas S/A; sociedades coligadas", "q": ["Incorporação (art. 227), fusão (art. 228) e cisão (art. 229): as três reorganizações societárias.", "Na incorporação ou fusão, a sucessão é universal e os credores têm 60 dias para pedir anulação (art. 232).", "Sociedade controlada, coligada e grupo de sociedades: arts. 243 e seguintes."], "txt": "<b>Incorporação (art. 227):<\/b> uma ou mais sociedades <b>são absorvidas<\/b> por outra, que lhes sucede em todos os direitos e obrigações.\n<b>Fusão (art. 228):<\/b> a união de duas ou mais sociedades <b>para formar uma nova<\/b>, que lhes sucede.\n<b>Cisão (art. 229):<\/b> operação pela qual a companhia transfere <b>parcelas do seu patrimônio<\/b> para uma ou mais sociedades, constituídas para esse fim ou já existentes.\n<b>Protocolo e justificação (arts. 224 e 225):<\/b> as condições da operação constam do <b>protocolo<\/b>, que é submetido às assembleias, acompanhado da <b>justificação<\/b>.\n<b>Credores (art. 232):<\/b> a incorporação ou fusão só ganha eficácia depois de <b>60 dias<\/b> da publicação dos atos, e os credores anteriores podem pedir judicialmente a anulação nesse prazo. Se a dívida é paga, a ação fica prejudicada.\n<b>Grupo de sociedades (art. 265 e seguintes):<\/b> a sociedade controladora e suas controladas podem se constituir em grupo por convenção. Cada sociedade mantém personalidade e patrimônio distintos.\n<b>Coligada (art. 243, §1º):<\/b> quando uma tem <b>influência significativa<\/b> sobre a outra, sem controlá-la (presume-se com 20% ou mais do capital votante). <b>Controlada:<\/b> a controladora tem a maioria dos votos.\n<b>Subsidiária integral (art. 251):<\/b> companhia com um só acionista, que deve ser sociedade brasileira."}]}, {"tema": "6. Defesa da concorrência (CADE, Lei 12.529/2011)", "itens": [{"id": "50", "t": "Para que serve a defesa da concorrência e quem a faz", "q": ["Base constitucional: livre concorrência (art. 170, IV, CF) e repressão ao abuso do poder econômico (art. 173, §4º, CF).", "Sistema Brasileiro de Defesa da Concorrência (SBDC): CADE + Secretaria de Acompanhamento Econômico (Lei 12.529/2011, art. 3º).", "CADE: autarquia federal; reprime infrações e analisa fusões e aquisições."], "txt": "A Constituição quer <b>mercado com competição<\/b>: ninguém pode dominar um setor e fazer o que quiser com preço e qualidade. A <b>livre concorrência<\/b> é princípio da ordem econômica (art. 170, IV, CF), e a lei reprime o <b>abuso do poder econômico<\/b> que vise à dominação dos mercados, à eliminação da concorrência e ao aumento arbitrário dos lucros (art. 173, §4º, CF).\n<b>Lei 12.529/2011:<\/b> é a 'Lei de Defesa da Concorrência' (a Lei Antitruste). Ela organiza o <b>SBDC<\/b> e define as infrações e as sanções.\n<b>Quem faz parte do SBDC (art. 3º):<\/b> o <b>CADE<\/b> (Conselho Administrativo de Defesa Econômica) e a <b>Secretaria de Acompanhamento Econômico<\/b> (do Ministério da Fazenda), esta com função de advocacia da concorrência.\n<b>CADE:<\/b> <b>autarquia federal<\/b>, com sede e foro no Distrito Federal, vinculada ao Ministério da Justiça. Tem <b>três órgãos<\/b> (art. 5º): o <b>Tribunal Administrativo<\/b> (julga), a <b>Superintendência-Geral<\/b> (instrui e investiga) e o <b>Departamento de Estudos Econômicos<\/b>.\n<b>Duas frentes:<\/b> <b>controle de condutas<\/b> (punir cartel, abuso de posição dominante etc.) e <b>controle de estruturas<\/b> (analisar fusões, aquisições e outros atos de concentração antes que eles se completem)."}, {"id": "51", "t": "Composição do CADE e mandatos", "q": ["Tribunal: Presidente e 6 Conselheiros, mandato de 4 anos, sem recondução (art. 6º).", "Nomeados pelo Presidente da República, depois de aprovados pelo Senado Federal (art. 6º, §1º).", "Superintendente-Geral: mandato de 2 anos, uma recondução (art. 12)."], "txt": "<b>Tribunal Administrativo (art. 6º):<\/b> composto por <b>1 Presidente e 6 Conselheiros<\/b>, escolhidos entre cidadãos com mais de 30 anos, de notório saber jurídico ou econômico e reputação ilibada.\n<b>Mandato:<\/b> <b>4 anos<\/b>, <b>sem recondução<\/b>. Isso garante independência: o conselheiro não precisa agradar ninguém para ser reconduzido.\n<b>Nomeação:<\/b> pelo <b>Presidente da República<\/b>, depois de <b>aprovação do Senado Federal<\/b> (sabatina). Quando o mandato termina, o conselheiro tem <b>quarentena<\/b> de 120 dias.\n<b>Decisões:<\/b> o Tribunal julga com <b>quórum mínimo de 4 membros<\/b> (art. 9º, §1º) e as decisões são tomadas por maioria.\n<b>Superintendência-Geral (art. 12):<\/b> chefiada pelo <b>Superintendente-Geral<\/b>, nomeado também pelo Presidente da República, após aprovação do Senado, com mandato de <b>2 anos<\/b>, permitida <b>uma única recondução<\/b>. É ela quem <b>instaura e instrui<\/b> os processos e aprova, sem condições, os atos de concentração simples (art. 65).\n<b>Procuradoria Federal e Ministério Público:<\/b> o CADE tem procuradoria própria (art. 15), e o MPF atua perante ele, com membro que oficia nos processos.\n<b>Pegadinha:<\/b> a decisão do CADE <b>não precisa ser homologada<\/b> por ninguém no Executivo (art. 9º): é <b>decisão administrativa final<\/b>, mas cabe revisão no Judiciário."}, {"id": "52", "t": "Infrações à ordem econômica", "q": ["Infração independe de culpa: basta ter por objeto ou produzir os efeitos do art. 36 (limitar concorrência, dominar mercado, aumentar lucros arbitrariamente, abusar de posição dominante).", "Posição dominante: presumida quando a empresa controla 20% ou mais do mercado relevante (art. 36, §2º).", "Cartel: acordo entre concorrentes para fixar preços, dividir mercados etc. É infração e também crime."], "txt": "<b>Art. 36 da Lei 12.529/2011:<\/b> constituem infração da ordem econômica os atos que tenham por <b>objeto<\/b> ou possam produzir os efeitos de: <b>I)<\/b> limitar, falsear ou prejudicar a livre concorrência; <b>II)<\/b> dominar mercado relevante; <b>III)<\/b> aumentar arbitrariamente os lucros; <b>IV)<\/b> exercer de forma abusiva posição dominante.\n<b>Responsabilidade objetiva:<\/b> a infração <b>independe de culpa<\/b>. Não importa se houve intenção, e <b>basta o potencial<\/b> de produzir os efeitos, mesmo que eles não aconteçam.\n<b>Posição dominante (art. 36, §2º):<\/b> é a que a empresa tem quando é capaz de alterar unilateralmente ou em conjunto as condições de mercado, ou quando controla <b>20% ou mais<\/b> do mercado relevante (percentual que o CADE pode alterar para setores específicos). <b>Atenção:<\/b> ter posição dominante <b>não é infração<\/b>. O <b>abuso<\/b> é que é proibido.\n<b>Mercado relevante:<\/b> tem uma dimensão <b>produto<\/b> (o que os consumidores veem como substituto) e uma <b>geográfica<\/b> (onde há concorrência).\n<b>Cartel (art. 36, §3º, I):<\/b> acordo entre concorrentes para fixar preços, dividir mercado, combinar propostas em licitação. É o 'crime' mais grave do direito da concorrência. Também é <b>crime<\/b> (art. 4º, II, da Lei 8.137/1990).\n<b>Outras condutas:<\/b> preço predatório, venda casada, recusa de venda, discriminação, imposição de exclusividade."}, {"id": "53", "t": "Sanções, leniência e termo de compromisso", "q": ["Multa para empresa: de 0,1% a 20% do faturamento bruto do último exercício, no ramo de atividade em que ocorreu a infração (art. 37, I).", "Programa de leniência (art. 86): quem denuncia o cartel e colabora pode ter extinção da ação punitiva ou redução da pena de 1/3 a 2/3.", "Termo de compromisso de cessação (TCC, art. 85): suspende o processo."], "txt": "<b>Multas (art. 37):<\/b>\n<b>Empresa:<\/b> de <b>0,1% a 20%<\/b> do <b>faturamento bruto<\/b> da empresa, grupo ou conglomerado no <b>último exercício anterior<\/b> à instauração do processo, <b>no ramo de atividade<\/b> em que ocorreu a infração. Nunca menos que a vantagem auferida.\n<b>Outras pessoas jurídicas<\/b> sem faturamento: de R$ 50 mil a R$ 2 bilhões.\n<b>Administrador responsável:<\/b> de <b>1% a 20%<\/b> da multa aplicada à empresa.\n<b>Pena em dobro:<\/b> em caso de reincidência.\n<b>Outras sanções (art. 38):<\/b> publicação da decisão, proibição de contratar com instituições financeiras oficiais e de participar de licitação por prazo <b>não inferior a 5 anos<\/b>, <b>cisão<\/b> de sociedade, venda de ativos, licença compulsória de direitos de propriedade intelectual.\n<b>Leniência (art. 86):<\/b> acordo com a Superintendência-Geral. <b>Quem confessa a participação em cartel<\/b> e colabora com as investigações pode ter <b>extinção<\/b> da ação punitiva (se o CADE não tinha conhecimento prévio) ou <b>redução de 1/3 a 2/3<\/b> da pena. Requisitos: ser o <b>primeiro<\/b> a se qualificar, cessar a participação, confessar e cooperar.\n<b>Termo de compromisso de cessação (art. 85):<\/b> o investigado se compromete a parar a conduta, e o processo é <b>suspenso<\/b> enquanto ele cumpre.\n<b>Prescrição (art. 46):<\/b> <b>5 anos<\/b> da data da prática do ilícito ou, se permanente ou continuado, do dia em que cessou."}, {"id": "54", "t": "Controle de estruturas: atos de concentração", "q": ["Ato de concentração: fusão, incorporação, aquisição de controle ou de partes, contrato associativo, consórcio ou joint venture (art. 90).", "Notificação prévia obrigatória se um grupo tem faturamento de R$ 750 milhões no Brasil e outro de R$ 75 milhões (art. 88, valores atualizados por portaria).", "O ato não pode ser concluído antes da aprovação (art. 88, §3º); prazo de análise: 240 dias, prorrogável (art. 88, §2º e §9º)."], "txt": "O CADE analisa <b>fusões e aquisições<\/b> antes que o mercado fique concentrado demais.\n<b>O que é ato de concentração (art. 90):<\/b> <b>I)<\/b> fusão de duas ou mais empresas; <b>II)<\/b> aquisição do controle ou de partes de uma ou outra empresa; <b>III)<\/b> incorporação; <b>IV)<\/b> <b>contrato associativo, consórcio ou joint venture<\/b>. Não é ato de concentração o consórcio para licitação.\n<b>Quando é preciso notificar (art. 88):<\/b> quando, ao mesmo tempo, <b>um dos grupos<\/b> envolvidos teve faturamento bruto anual ou volume de negócios total no Brasil, no último balanço, igual ou superior a <b>R$ 750 milhões<\/b> e <b>outro<\/b> grupo igual ou superior a <b>R$ 75 milhões<\/b> (valores fixados em portaria interministerial, e podem ser alterados).\n<b>Controle prévio:<\/b> o ato <b>não pode ser consumado<\/b> antes da aprovação do CADE. Fazê-lo é <b>'gun jumping'<\/b>, punido com multa de R$ 60 mil a R$ 60 milhões e nulidade (art. 88, §3º).\n<b>Prazo (art. 88, §2º):<\/b> <b>240 dias<\/b> contados da notificação, prorrogáveis por <b>até 60 dias<\/b> a pedido das partes ou por <b>até 90 dias<\/b> por decisão fundamentada do Tribunal (§9º).\n<b>Resultado:<\/b> aprova sem restrições, aprova com <b>restrições<\/b> (acordo em controle de concentrações, ACC) ou <b>reprova<\/b>.\n<b>Operação abaixo dos valores:<\/b> mesmo assim, o CADE pode requerer a submissão do ato em até <b>1 ano<\/b> da consumação (art. 88, §7º)."}]}, {"tema": "7. Empresas estatais (Lei 13.303/2016)", "itens": [{"id": "55", "t": "O que é a Lei das Estatais e a quem se aplica", "q": ["Estatuto jurídico da empresa pública, da sociedade de economia mista e de suas subsidiárias (art. 1º).", "Vale para quem explora atividade econômica de produção ou comercialização de bens ou de prestação de serviços, ainda que em monopólio ou serviço público.", "Base constitucional: art. 173, §1º, da CF."], "txt": "A <b>Lei 13.303/2016<\/b> é a <b>Lei das Estatais<\/b>. Ela cumpre o art. 173, §1º, da Constituição, que mandava criar um estatuto para as empresas do Estado que exploram atividade econômica.\n<b>A quem se aplica (art. 1º):<\/b> à <b>empresa pública<\/b>, à <b>sociedade de economia mista<\/b> e às suas <b>subsidiárias<\/b>, no âmbito da União, dos Estados, do Distrito Federal e dos Municípios, que explorem <b>atividade econômica de produção ou comercialização de bens ou de prestação de serviços<\/b>, ainda que a atividade esteja sujeita ao regime de <b>monopólio<\/b> ou seja <b>serviço público<\/b>.\n<b>Matérias que ela trata:<\/b> constituição e funcionamento, governança, administradores e conselho fiscal, licitações e contratos, fiscalização e responsabilidade.\n<b>Quando o Estado pode ter empresa (art. 173, CF):<\/b> só quando necessário aos <b>imperativos da segurança nacional<\/b> ou a <b>relevante interesse coletivo<\/b>, nos termos da lei.\n<b>Estatais de menor porte:<\/b> as de receita operacional bruta abaixo de R$ 90 milhões seguem regras de governança mais simples, que o Poder Executivo pode definir (art. 1º)."}, {"id": "56", "t": "Empresa pública x sociedade de economia mista", "q": ["Empresa pública: capital 100% público, qualquer forma societária (art. 3º).", "Sociedade de economia mista: sempre S/A; a maioria das ações com voto pertence ao ente público (art. 4º).", "Ambas têm personalidade de direito privado."], "txt": "As duas são <b>pessoas jurídicas de direito privado<\/b>, criadas por autorização de lei, mas com diferenças importantes:\n<b>Empresa pública (art. 3º):<\/b> capital social <b>integralmente público<\/b> (da União, de Estado, do DF ou de Município). Pode ter <b>qualquer forma societária<\/b> (inclusive S/A, limitada). Admite participação de <b>outras pessoas jurídicas de direito público interno<\/b> e de entidades da administração indireta, desde que a maioria do capital votante seja do ente instituidor.\n<b>Sociedade de economia mista (art. 4º):<\/b> a lei fala em <b>forma de sociedade anônima<\/b>, com <b>maioria das ações com direito a voto pertencendo à União, aos Estados, ao DF ou aos Municípios<\/b> (ou a entidade da administração indireta). Tem <b>acionistas privados<\/b> minoritários. Segue a Lei das S/A, no que não contrariar a Lei 13.303.\n<b>Subsidiárias (art. 2º):<\/b> criar subsidiária ou participar de empresa privada exige <b>autorização legislativa<\/b>, e o objeto social deve ter relação com o da estatal.\n<b>Criação:<\/b> por <b>lei específica<\/b> (art. 37, XIX e XX, CF). A criação de subsidiárias também depende de autorização legislativa, que pode estar na própria lei da estatal-mãe.\n<b>Registro:<\/b> a personalidade começa com o registro dos atos constitutivos no <b>órgão competente<\/b> (Junta Comercial)."}, {"id": "57", "t": "Regime jurídico: pessoal, bens, tributos e falência", "q": ["Pessoal: celetista com concurso público (art. 37, II, CF), e submetido ao teto se receber recursos para custeio (art. 37, §9º, CF).", "Estatais não podem falir nem pedir recuperação judicial (art. 2º, I, Lei 11.101).", "Bens: regime privado; penhoráveis se a estatal explora atividade econômica. Prestadora de serviço público em regime não concorrencial: precatório (STF)."], "txt": "Quem trabalha na estatal é <b>empregado público<\/b>, regido pela <b>CLT<\/b>, mas contratado por <b>concurso público<\/b> (art. 37, II, CF). Se a estatal depender de recursos da União para pagar despesas de pessoal ou custeio, <b>submete-se ao teto remuneratório<\/b> (art. 37, §9º, CF). A dispensa dos empregados precisa de <b>motivação<\/b> (STF, RE 589.998).\n<b>Falência e recuperação:<\/b> a <b>Lei 11.101/2005 não se aplica<\/b> às empresas públicas e sociedades de economia mista (art. 2º, I). Não podem falir nem pedir RJ. Quem responde pelas dívidas é o ente público, de forma <b>subsidiária<\/b>.\n<b>Tributos:<\/b> em regra, a estatal que explora atividade econômica <b>não tem privilégios fiscais<\/b> não extensíveis ao setor privado (art. 173, §2º, CF). A <b>imunidade recíproca<\/b> (art. 150, VI, a, CF) vale, segundo o STF, para estatais prestadoras de <b>serviço público<\/b> em regime não concorrencial (como os Correios).\n<b>Bens e execução:<\/b> os bens da estatal que explora atividade econômica são <b>penhoráveis<\/b> (art. 173, §1º, II, CF), e a execução segue o regime comum. Se a estatal presta <b>serviço público essencial em regime não concorrencial<\/b>, aplica-se o <b>regime de precatórios<\/b> (art. 100 CF), conforme o STF.\n<b>Responsabilidade do Estado:<\/b> subsidiária, no caso de estatais que prestam serviço público (art. 37, §6º, CF)."}, {"id": "58", "t": "Governança e requisitos dos administradores", "q": ["Administradores: experiência de 10 anos na área (ou 4 anos em cargos de direção ou chefia superior), formação compatível e sem inelegibilidade (art. 17).", "Vedações: ministro de Estado, secretário, dirigente de partido, titular de mandato legislativo, quem atuou em campanha eleitoral nos 36 meses anteriores (art. 17, §2º).", "Mandato unificado de até 2 anos, com no máximo 3 reconduções consecutivas (art. 13)."], "txt": "A lei obriga a estatal a manter <b>boa governança<\/b>, para evitar uso político. Pontos principais:\n<b>Conselho de administração:<\/b> de <b>7 a 11 membros<\/b> e, no mínimo, <b>25% de independentes<\/b> (ou ao menos 1, se minoritários usarem o voto múltiplo; arts. 13 e 22). A diretoria tem no mínimo <b>3 diretores<\/b>.\n<b>Requisitos dos administradores (art. 17):<\/b> <b>I)<\/b> experiência profissional de pelo menos <b>10 anos<\/b> na área de atuação (ou outra comprovação de qualificação); <b>II)<\/b> <b>formação acadêmica<\/b> compatível com o cargo; <b>III)<\/b> <b>não ser inelegível<\/b> (Lei da Ficha Limpa).\n<b>Vedações (art. 17, §2º):<\/b> não podem ser administradores: representante do órgão regulador ao qual a empresa está sujeita; <b>ministro de Estado<\/b>, secretário estadual ou municipal; titular de cargo em comissão; <b>dirigente estatutário de partido político<\/b> e titular de mandato no Legislativo, ainda que licenciado; dirigente de sindicato; quem atuou, nos <b>últimos 36 meses<\/b>, em estrutura decisória de partido ou em campanha eleitoral; e quem tenha contratado com a controladora ou com a empresa nos últimos 3 anos.\n<b>Mandato (art. 13):<\/b> <b>unificado, de até 2 anos<\/b>, com <b>até 3 reconduções consecutivas<\/b>. Conselheiros fiscais: até 2 anos, com até 2 reconduções."}, {"id": "59", "t": "Licitações e contratos das estatais", "q": ["Regulamento próprio de licitações e contratos (RILC), aprovado pela própria empresa (art. 40).", "Dispensa de licitação: valores pequenos e hipóteses do art. 29; inexigibilidade no art. 30.", "Prazo máximo dos contratos: 5 anos, salvo exceções (art. 71)."], "txt": "A estatal <b>não segue a Lei 14.133/2021<\/b> (nem a antiga Lei 8.666) para as suas licitações. Ela tem <b>lei própria<\/b>: a Lei 13.303, nos arts. 28 a 84.\n<b>Regulamento (art. 40):<\/b> cada estatal publica seu <b>regulamento de licitações e contratos<\/b> (RILC).\n<b>Regra (art. 31):<\/b> buscar a proposta mais vantajosa, com impessoalidade, moralidade, eficiência, economicidade e julgamento objetivo, evitando sobrepreço e superfaturamento.\n<b>Dispensa (art. 29):<\/b> hipóteses como obras e serviços de engenharia de até <b>R$ 100 mil<\/b>, outros serviços e compras até <b>R$ 50 mil<\/b>, emergência e licitação deserta. <b>Inexigibilidade (art. 30):<\/b> competição inviável, como fornecedor exclusivo ou contratação de artista consagrado.\n<b>Fora das regras de licitação (art. 28, §3º):<\/b> a comercialização ou execução direta de produtos e serviços ligados ao <b>objeto social<\/b>, e as parcerias em <b>oportunidades de negócio<\/b> em que a competição é inviável.\n<b>Procedimento:<\/b> é o <b>pregão<\/b> para bens e serviços comuns (art. 32, IV). A <b>habilitação<\/b> vem depois do julgamento das propostas.\n<b>Contratos (art. 71):<\/b> duração máxima de <b>5 anos<\/b>, exceto os de projetos com prazo maior, ligados a investimento. Acréscimos e supressões unilaterais: até <b>25%<\/b> (art. 81, §1º).\n<b>Sanções (art. 83):<\/b> advertência, multa e suspensão de participar de licitação por até <b>2 anos<\/b>."}, {"id": "60", "t": "Função social, fiscalização e responsabilidade do controlador", "q": ["Função social: realizar o interesse coletivo que justificou a criação; pode ter objetivos de políticas públicas desde que compatíveis com o mercado (art. 27).", "O ente controlador responde pelos arts. 116 e 117 da Lei 6.404 (art. 15); administradores respondem como na lei das S/A (art. 16).", "Controle: Tribunal de Contas, controle interno e sociedade (arts. 85 a 90)."], "txt": "<b>Função social (art. 27):<\/b> a estatal deve realizar o <b>interesse coletivo<\/b> ou atender ao <b>imperativo de segurança nacional<\/b> que justificou sua criação, definido na lei autorizativa. A função social inclui ampliar o acesso dos consumidores de forma sustentável, usar tecnologia brasileira quando justificado e adotar práticas de sustentabilidade. Pode ter <b>objetivos de políticas públicas<\/b> se a lei os previr.\n<b>Responsabilidade do controlador (art. 15):<\/b> o <b>ente público acionista controlador<\/b> responde pelos atos praticados com abuso de poder, na forma dos <b>arts. 116 e 117 da Lei das S/A<\/b>. A <b>ação de reparação<\/b> pode ser proposta pela própria empresa ou pelos acionistas.\n<b>Responsabilidade dos administradores (art. 16):<\/b> aplicam-se as normas da Lei das S/A (art. 153 a 160). Os <b>membros do conselho fiscal<\/b> também respondem (art. 165 da LSA).\n<b>Fiscalização (arts. 85 a 90):<\/b> pelo Estado e pela sociedade: <b>controle interno<\/b>, pelo <b>Tribunal de Contas<\/b>, e <b>transparência<\/b> ativa. As estatais devem divulgar informações como cotas de remuneração, contratos e política de divulgação,.\n<b>Conselho fiscal:<\/b> deve ser <b>permanente<\/b> (art. 13), com participação de minoritários.\n<b>Pegadinha:<\/b> o tema não se confunde com a Lei de Improbidade nem com a Lei Anticorrupção, que também alcançam as estatais."}]}, {"tema": "8. Revisão final: o que mais cai", "itens": [{"id": "61", "t": "Quadro de prazos e números para decorar", "q": ["Recuperação judicial e falência: 2 anos de atividade, stay de 180 dias, plano em 60 dias, objeção em 30, termo legal de 90 dias.", "Falência: habilitação em 15 dias, impugnação em 10, 3 anos para habilitar retardatário, revocatória em 3 anos.", "Outros: CADE 4 anos de mandato e 240 dias de análise; S/A: AGO em 4 meses."], "txt": "Veja, em um só lugar, os números mais cobrados:", "tab": {"head": ["Assunto", "Número", "Fonte"], "rows": [["Atividade regular para pedir RJ", "mais de 2 anos", "Lei 11.101, art. 48"], ["Stay period", "180 dias, prorrogável 1 vez por mais 180", "art. 6º, §4º"], ["Plano de recuperação", "60 dias, improrrogáveis", "art. 53"], ["Objeção ao plano", "30 dias", "art. 55"], ["Trabalhistas no plano", "1 ano; salários atrasados: 30 dias (até 5 SM)", "art. 54"], ["Termo legal da falência", "até 90 dias antes do pedido", "art. 99, II"], ["Pedido de falência por impontualidade", "mais de 40 salários-mínimos", "art. 94, I"], ["Defesa no pedido de falência", "10 dias", "art. 98"], ["Habilitação de crédito (administrativa)", "15 dias do edital", "art. 7º, §1º"], ["Impugnação à lista", "10 dias", "art. 8º"], ["Habilitação retardatária", "até 3 anos da sentença de falência", "art. 10, §10"], ["Ação revocatória", "3 anos da decretação", "art. 132"], ["Responsabilidade de sócios na falência", "2 anos do trânsito do encerramento", "art. 82, §1º"], ["Extinção das obrigações (quirografários)", "mais de 25%", "art. 158, II"], ["Retirada de sócio (prazo indeterminado)", "aviso com 60 dias", "CC, art. 1.029"], ["Mandato de conselheiro do CADE", "4 anos, sem recondução", "Lei 12.529, art. 6º"], ["Análise de ato de concentração", "240 dias + 60 ou 90", "Lei 12.529, art. 88"], ["AGO da S/A", "4 meses após o fim do exercício", "Lei 6.404, art. 132"]]}}, {"id": "62", "t": "Quóruns do Direito Empresarial: tabela única", "q": ["Limitada, hoje: mais da metade do capital para alterar o contrato, incorporar, fundir, dissolver e designar administrador.", "S/A: reforma do estatuto exige 2/3 do capital votante em 1ª convocação (art. 135).", "RJ: aprovação em todas as classes; cram down: mais da metade de todos os créditos + 3 classes + 1/3 na classe que rejeitou."], "txt": "Quórum é pergunta clássica. Memorize a tabela.", "tab": {"head": ["Situação", "Quórum"], "rows": [["Limitada: alterar contrato, incorporação, fusão, dissolução", "Mais da metade do capital social (art. 1.076, II, CC, Lei 14.451/2022)"], ["Limitada: administrador não sócio", "Unanimidade, enquanto o capital não estiver integralizado; mais da metade, depois (art. 1.061)"], ["Limitada: instalação da reunião", "1ª convocação: 3/4 do capital; 2ª: qualquer número (art. 1.074)"], ["Limitada: cessão de quotas a estranho", "Vale se não houver oposição de titulares de mais de 1/4 do capital (art. 1.057)"], ["Limitada: exclusão de sócio", "Maioria dos sócios, mais da metade do capital (art. 1.085)"], ["S/A: instalação da assembleia", "1ª convocação: 1/4 do capital votante; 2ª: qualquer número (art. 125)"], ["S/A: reforma do estatuto, instalação", "1ª convocação: 2/3 do capital votante (art. 135)"], ["S/A: deliberação", "Maioria absoluta dos votos presentes, sem os brancos (art. 129)"], ["S/A: matérias do art. 136", "No mínimo metade das ações com voto"], ["RJ: instalação da assembleia", "1ª convocação: mais da metade dos créditos de cada classe; 2ª: qualquer número (art. 37, §2º)"], ["RJ: aprovação do plano", "Todas as classes (art. 45)"], ["RJ: cram down", "Mais da metade dos créditos + 3 classes + mais de 1/3 na classe que rejeitou (art. 58, §1º)"]]}}, {"id": "63", "t": "As pegadinhas que mais derrubam candidato", "q": ["Crédito tributário: fora da RJ e da habilitação, mas entra na fila da falência (art. 83, III).", "Quem compra na falência não herda as dívidas (art. 141, II); exceção: sócio, parente ou agente do falido.", "Desconsideração: teoria maior (abuso) no Direito Civil e Empresarial; menor (insolvência) no consumo e no ambiental."], "txt": "<b>1) Estatal não vai para a falência.<\/b> A Lei 11.101 não se aplica a empresa pública e sociedade de economia mista (art. 2º, I).\n<b>2) Fisco na RJ:<\/b> a execução fiscal não é suspensa pelo stay. Mas o juiz da RJ pode substituir penhora de bem de capital essencial.\n<b>3) Agravo, não apelação:<\/b> da decisão que concede a RJ e da que decreta a falência cabe <b>agravo de instrumento<\/b>.\n<b>4) Ineficácia x revocatória:<\/b> a primeira independe de fraude e pode ser declarada de ofício; a segunda exige conluio fraudulento e prejuízo, e ação própria em 3 anos.\n<b>5) Fila da falência:<\/b> trabalhistas (até 150 SM), garantia real, tributários, quirografários, multas, subordinados. Os antigos privilégios (art. 83, IV e V) foram revogados.\n<b>6) Sociedade em comum:<\/b> quem contratou perde o benefício de ordem.\n<b>7) Conta de participação:<\/b> o participante só responde perante o ostensivo.\n<b>8) Quórum da limitada:<\/b> hoje é mais da metade do capital, não mais 3/4.\n<b>9) Desconsideração:<\/b> exige incidente com contraditório (CPC, arts. 133 a 137), exceto se pedida já na inicial.\n<b>10) Cartel:<\/b> infração independente de culpa; multa de 0,1% a 20% do faturamento no ramo.\n<b>11) Leniência:<\/b> só o primeiro a se apresentar tem benefício.\n<b>12) CND na RJ:<\/b> o STJ exige a certidão, e a falta suspende o processo, não gera falência."}]}];

const m=document.getElementById('m'),back=document.getElementById('back'),ct=document.getElementById('ct');
const SZ=[16,17,19,21];let si=1;try{const v=parseInt(localStorage.getItem('iemp_sz'));if(v>=0&&v<SZ.length)si=v}catch(e){}
function applySz(){document.documentElement.style.setProperty('--fs',SZ[si]+'px')}applySz();
document.getElementById('aa').onclick=()=>{si=(si+1)%SZ.length;applySz();try{localStorage.setItem('iemp_sz',si)}catch(e){}};
let DONE={};try{DONE=JSON.parse(localStorage.getItem('iemp_done')||'{}')}catch(e){}
function save(){try{localStorage.setItem('iemp_done',JSON.stringify(DONE))}catch(e){}}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const ALL=[];D.forEach(g=>g.itens.forEach(i=>{i.tema=g.tema;ALL.push(i)}));
function home(){
 ct.textContent='Direito Empresarial fácil';back.style.display='none';m.innerHTML='';
 m.appendChild(el('div','title','<big>iEmpresarial</big>'));
 const q=el('p','sub','Direito Empresarial do zero, só o que mais cai na prova.');q.style.textAlign='center';m.appendChild(q);
 const dn=ALL.filter(i=>DONE[i.id]).length;
 const pg=el('div','pg','<i style="width:'+Math.round(100*dn/ALL.length)+'%"></i>');m.appendChild(pg);
 const pn=el('p','nt',dn+' de '+ALL.length+' tópicos lidos');m.appendChild(pn);
 D.forEach(g=>{
  const h=el('div','h');h.textContent=g.tema+' ('+g.itens.length+' tópicos)';m.appendChild(h);
  const me=el('div','menu');
  g.itens.forEach(i=>{const a=el('a',DONE[i.id]?'ok':'','<span class="s"></span><span class="t"></span>');
   a.querySelector('.s').textContent='Tópico '+i.id+(DONE[i.id]?' ✓':'');a.querySelector('.t').textContent=i.t;a.href='#/'+i.id;me.appendChild(a)});
  m.appendChild(me);
 });
}
function topic(id){
 const i=ALL.findIndex(x=>x.id===id);if(i<0)return home();const t=ALL[i];
 back.style.display='';back.href='#/';ct.textContent=t.tema;m.innerHTML='';
 m.appendChild(el('div','h')).textContent='Tópico '+t.id;
 const s=el('p','sub');s.textContent=t.t;m.appendChild(s);
 m.appendChild(el('div','qr','<h4>Quadro resumo</h4><ul>'+t.q.map(x=>'<li>'+x+'</li>').join('')+'</ul>'));
 const d=el('div','fala',t.txt.split('\n').map(p=>'<p>'+p+'</p>').join(''));m.appendChild(d);
 if(t.tab){const w=el('div','tw','<table><thead><tr>'+t.tab.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+t.tab.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>');m.appendChild(w)}
 const b=el('button','mk'+(DONE[t.id]?' on':''),DONE[t.id]?'✓ Lido':'Marcar como lido');
 b.onclick=()=>{DONE[t.id]=!DONE[t.id];save();b.className='mk'+(DONE[t.id]?' on':'');b.textContent=DONE[t.id]?'✓ Lido':'Marcar como lido'};m.appendChild(b);
 const n=el('div','nv');const pr=el('a',i>0?'':'off','‹ Anterior'),ix=el('a','','Temas'),nx=el('a',i<ALL.length-1?'':'off','Próximo ›');
 pr.href=i>0?'#/'+ALL[i-1].id:'#';ix.href='#/';nx.href=i<ALL.length-1?'#/'+ALL[i+1].id:'#';n.append(pr,ix,nx);m.appendChild(n);
}
function route(){const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(s[0])topic(s[0]);else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
