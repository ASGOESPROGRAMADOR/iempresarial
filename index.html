<div class="top"><div class="l"><a id="back" href="#/" style="display:none">&#8592;</a><a href="#/" id="brand">iEmpresarial</a></div><div class="c" id="ct">Direito Empresarial fácil</div><div class="r"><button id="aa" aria-label="Tamanho do texto">Aa</button></div></div>

<script>
const D=[{"tema": "1. Recuperação judicial", "itens": [{"id": "1", "t": "O que é recuperação judicial e para quem serve", "q": ["RJ = a empresa devedora ganha fôlego, na Justiça, para negociar a dívida e continuar funcionando.", "Regra de ouro: atividade regular há mais de 2 anos (art. 48 da Lei 11.101/2005).", "Ficam de fora: estatais, bancos, seguradoras, planos de saúde, cooperativas de crédito (art. 2º)."], "txt": "Imagine uma padaria que ficou devendo para todo mundo, mas ainda vende pão e dá emprego. Fechar seria ruim para todos. A <b>recuperação judicial (RJ)<\/b> serve para isso: o juiz dá um tempo para a empresa negociar com os credores, sem ser atacada por cobranças, para continuar funcionando (art. 47 da Lei 11.101/2005, atualizada pela Lei 14.112/2020).\n<b>Quem pode pedir:<\/b> o empresário ou a sociedade empresária que <b>exerce atividade regular há mais de 2 anos<\/b> e, ao mesmo tempo (art. 48): não é falido (ou, se foi, já teve as obrigações declaradas extintas); não obteve outra RJ nos últimos 5 anos; e não foi condenado por crime falimentar (nem tem administrador ou sócio controlador condenado).\n<b>Quem não pode (art. 2º):<\/b> empresa pública, sociedade de economia mista, instituição financeira, cooperativa de crédito, consórcio, entidade de previdência complementar, operadora de plano de saúde e seguradora.\n<b>E se o empresário morrer?<\/b> O cônjuge sobrevivente, os herdeiros, o inventariante ou o sócio remanescente podem pedir a RJ (art. 48, §1º)."}, {"id": "2", "t": "Passo a passo: do pedido ao deferimento", "q": ["Petição inicial com os documentos do art. 51 → juiz defere o processamento (art. 52).", "Efeito imediato: suspensão das ações e execuções (stay period) por 180 dias, prorrogáveis uma vez por mais 180 (art. 6º, §4º).", "Os donos continuam no comando, fiscalizados pelo administrador judicial."], "txt": "<b>1) O pedido.<\/b> A empresa entra com a petição inicial e junta documentos: explicação da crise, balanços dos 3 últimos exercícios, lista de todos os credores, lista de empregados, certidão da Junta Comercial, extratos bancários, lista das ações judiciais e outros (art. 51).\n<b>2) Constatação prévia.<\/b> O juiz pode mandar um perito verificar, rapidamente, se a empresa existe de verdade e se a documentação está em ordem (art. 51-A). Serve para barrar pedido de fachada.\n<b>3) Deferimento do processamento (art. 52).<\/b> Estando tudo certo, o juiz nomeia o <b>administrador judicial<\/b> (o fiscal do processo), dispensa a empresa de apresentar certidões negativas para exercer suas atividades (<b>exceto<\/b> para contratar com o Poder Público ou receber benefícios fiscais ou de crédito), <b>suspende as ações e execuções<\/b> contra ela e manda publicar edital.\n<b>4) Stay period.<\/b> A suspensão dura <b>180 dias<\/b> a partir do deferimento, prorrogáveis <b>uma única vez<\/b> por igual período, em caráter excepcional, se o devedor não atrapalhou o andamento (art. 6º, §4º). Para prorrogar não precisa de votação em assembleia.\n<b>Atenção:<\/b> a Justiça não toca a empresa. Os donos seguem administrando e só saem em casos graves (art. 64)."}, {"id": "3", "t": "Quem entra na RJ e quem fica de fora", "q": ["Em regra, entram todos os créditos existentes na data do pedido, inclusive os ainda não vencidos (art. 49).", "STJ, Tema 1.051: o crédito 'existe' na data do fato gerador, não na da sentença.", "Ficam de fora: credor que é dono do bem (alienação fiduciária, leasing, reserva de domínio, promessa de imóvel irrevogável), ACC e o Fisco."], "txt": "A pergunta clássica: <b>qual dívida entra no plano?<\/b> Regra (art. 49): <b>todos os créditos que existem na data do pedido<\/b>, mesmo os não vencidos. Dívida criada depois do pedido não entra: é paga normalmente.\n<b>Quando o crédito 'existe'?<\/b> O STJ (Tema 1.051) respondeu: na data do <b>fato gerador<\/b>, isto é, do acontecimento que originou a dívida. Se a sentença saiu depois do pedido, mas o fato foi antes, a dívida entra.\n<b>Ficam de fora (não se sujeitam):<\/b>\n<b>1)<\/b> Credor que é <b>dono do bem<\/b>: banco com alienação fiduciária, empresa de leasing, vendedor com reserva de domínio, promitente vendedor de imóvel com contrato irrevogável (art. 49, §3º). Ele mantém a garantia, mas, durante o stay, não pode retirar bem de capital essencial à atividade.\n<b>2)<\/b> Adiantamento de contrato de câmbio, o ACC, na exportação (§4º).\n<b>3)<\/b> <b>Tributos<\/b>: o crédito tributário não entra na RJ (art. 187 do CTN). Veja o tópico próprio.\n<b>Entram:<\/b> trabalhistas, garantia real (hipoteca, penhor) e quirografários. Quem tem fiador ou avalista mantém o direito contra eles (art. 49, §1º)."}, {"id": "4", "t": "O plano de recuperação", "q": ["Prazo: 60 dias improrrogáveis, contados da publicação da decisão de processamento (art. 53).", "Sem plano no prazo = convolação em falência (art. 73, II).", "Trabalhistas: pagamento em até 1 ano; salários atrasados (até 5 salários-mínimos, dos últimos 3 meses): 30 dias (art. 54)."], "txt": "O <b>plano de recuperação<\/b> é a proposta da empresa para pagar as dívidas. Pense numa renegociação feita na frente do juiz.\n<b>Prazo:<\/b> 60 dias, improrrogáveis, a partir da publicação da decisão que deferiu o processamento (art. 53). Perdeu o prazo, vai para a falência.\n<b>O que contém:<\/b> os meios de recuperação (art. 50): prazos e condições especiais de pagamento, venda de bens, trespasse, cisão, fusão, aumento de capital, redução de salário por acordo ou convenção coletiva e outros; a prova de que a empresa é viável; e laudos de avaliação dos bens.\n<b>Proteção aos trabalhadores (art. 54):<\/b> o plano não pode prever mais de <b>1 ano<\/b> para pagar os créditos trabalhistas vencidos até o pedido (pode chegar a 2 anos, se houver garantias, aprovação dos trabalhadores e pagamento integral). E não pode passar de <b>30 dias<\/b> o pagamento dos salários atrasados dos 3 meses anteriores, até 5 salários-mínimos por pessoa.\n<b>Depois:<\/b> os credores têm <b>30 dias<\/b> para objetar (art. 55). Sem objeção, o plano é aprovado. Com objeção, o juiz convoca a <b>assembleia geral de credores<\/b>, que deve ocorrer em até 150 dias do deferimento (art. 56, §1º)."}, {"id": "5", "t": "Assembleia geral de credores: classes e votos", "q": ["Classes: I trabalhistas; II garantia real; III quirografários e subordinados; IV microempresas e empresas de pequeno porte.", "Classes I e IV: voto por cabeça. Classes II e III: valor do crédito e número de credores, ao mesmo tempo (art. 45).", "Regra geral: o plano só passa se for aprovado em todas as classes."], "txt": "A assembleia é a 'reunião de condomínio' dos credores. Eles votam divididos em <b>quatro classes<\/b> (art. 41), porque têm interesses diferentes.\nPara o plano ser aprovado, a regra é: <b>aprovação em todas as classes que votam<\/b> (art. 45).\n<b>Quórum de instalação (art. 37, §2º):<\/b> na 1ª convocação, mais da metade dos créditos de cada classe; na 2ª, qualquer número.\n<b>Quem não vota:<\/b> sócios do devedor e empresas ligadas a ele (coligadas, controladoras, controladas ou com sócio em comum) podem participar, mas <b>sem voto<\/b> e sem contar para o quórum (art. 43).\n<b>O que a assembleia decide (art. 35):<\/b> aprovação, rejeição ou modificação do plano, comitê de credores, forma de realização do ativo na falência e outros.", "tab": {"head": ["Classe", "Quem é", "Como a aprovação é contada"], "rows": [["I", "Trabalhistas e acidente de trabalho", "Maioria simples dos credores presentes (por cabeça)"], ["II", "Garantia real", "Mais da metade do valor dos créditos presentes E maioria simples dos credores presentes"], ["III", "Quirografários e subordinados", "Mais da metade do valor dos créditos presentes E maioria simples dos credores presentes"], ["IV", "ME e EPP", "Maioria simples dos credores presentes (por cabeça)"]]}}, {"id": "6", "t": "Plano rejeitado? Cram down e plano dos credores", "q": ["Cram down: o juiz concede a RJ mesmo sem aprovação em todas as classes (art. 58, §1º).", "Três requisitos juntos: mais da metade de todos os créditos presentes; aprovação em 3 classes (ou 2, se só houver 3; ou 1, se só houver 2); e mais de 1/3 dos credores na classe que rejeitou.", "Plano alternativo dos credores: art. 56, §§4º a 6º (Lei 14.112)."], "txt": "Se o plano não passar em todas as classes, em tese a empresa vai à falência. Mas a lei criou uma válvula: o <b>cram down<\/b> (em inglês, 'empurrar goela abaixo'). O juiz pode conceder a recuperação mesmo assim, se, <b>na mesma assembleia<\/b>, houver <b>os três requisitos juntos<\/b> (art. 58, §1º):\n<b>I)<\/b> voto favorável de credores que representem <b>mais da metade do valor de todos os créditos presentes<\/b>, somando todas as classes;\n<b>II)<\/b> aprovação em <b>3 classes<\/b> (se só 3 classes tiverem credores votantes, em 2; se só 2, em 1);\n<b>III)<\/b> na classe que rejeitou, voto favorável de <b>mais de 1/3 dos credores<\/b>.\n<b>Trava de justiça (§2º):<\/b> o plano não pode dar tratamento diferente entre credores da classe que o rejeitou, nem impor sacrifício maior do que o da falência.\n<b>Plano dos credores (Lei 14.112):<\/b> rejeitado o plano, a assembleia pode votar dar 30 dias para os credores apresentarem o seu (art. 56, §4º). Só vai à votação se tiver apoio por escrito de mais de 25% dos créditos totais ou mais de 35% dos presentes, e se não impuser novas obrigações aos sócios nem sacrifício maior que o da falência (§6º)."}, {"id": "7", "t": "Homologação, novação e fiscalização", "q": ["Aprovado o plano, o juiz concede a RJ por sentença (art. 58); cabe agravo de instrumento (art. 59, §2º).", "O plano gera novação das dívidas anteriores ao pedido (art. 59); a sentença é título executivo judicial.", "Fiscalização por 2 anos após a concessão (art. 61); descumprimento dentro desse prazo leva à falência."], "txt": "Plano aprovado (pela assembleia ou por falta de objeção), o juiz <b>concede a recuperação judicial<\/b> por sentença (art. 58).\n<b>Novação (art. 59):<\/b> as dívidas antigas, anteriores ao pedido, deixam de existir como eram e viram as obrigações do plano. É como trocar vários boletos atrasados por um parcelamento novo. A sentença que concede a RJ é <b>título executivo judicial<\/b>.\n<b>O que não some:<\/b> o credor mantém seus direitos contra <b>fiadores e coobrigados<\/b> (art. 49, §1º), e as <b>garantias reais<\/b> só caem se o titular concordar (art. 50, §1º).\n<b>Recurso:<\/b> contra a sentença cabe <b>agravo de instrumento<\/b> (art. 59, §2º), e não apelação.\n<b>Fiscalização (art. 61):<\/b> a empresa fica em RJ até cumprir as obrigações do plano que vencerem em <b>2 anos<\/b> depois da concessão. Nesse período, se descumprir, o juiz convola em falência. Passados os 2 anos, o descumprimento permite ao credor executar o plano ou pedir a falência pelo art. 94.\n<b>Encerramento:<\/b> o juiz encerra a RJ por sentença, com relatório do administrador judicial (art. 63)."}, {"id": "8", "t": "Dívidas com o Fisco na recuperação", "q": ["Tributo não entra na RJ e a execução fiscal não é suspensa pelo stay (art. 187 do CTN; art. 6º, §7º-B).", "O juiz da RJ pode substituir penhora sobre bem de capital essencial (art. 6º, §7º-B).", "Homologação exige certidão negativa de tributos (ou positiva com efeito de negativa): art. 57 e art. 191-A do CTN; STJ: sem ela, o processo fica suspenso, não vira falência."], "txt": "Aqui há uma regra de ouro: <b>o Fisco não se submete à RJ<\/b>. A cobrança do crédito tributário não está sujeita a concurso de credores nem a habilitação em recuperação judicial ou falência (art. 187 do CTN).\n<b>Execução fiscal:<\/b> não é suspensa pelo stay. Mas o juiz da recuperação pode <b>substituir<\/b> penhoras sobre <b>bens de capital essenciais<\/b> à atividade até o encerramento da RJ, por cooperação com o juiz da execução (art. 6º, §7º-B).\n<b>Certidões:<\/b> para o plano ser homologado, a empresa deve apresentar certidão negativa de débitos tributários, ou positiva com efeito de negativa (art. 57; art. 191-A do CTN). Como a Lei 14.112 criou parcelamento especial, o STJ voltou a exigir a certidão: sem ela o processo fica <b>suspenso<\/b> (não vira falência).\n<b>Parcelamento:<\/b> a Fazenda Nacional parcela em até <b>120 meses<\/b> (art. 10-A da Lei 10.522/2002). Estados e Municípios parcelam conforme sua lei específica (art. 68 da Lei 11.101).\n<b>Cuidado:<\/b> descumprir o parcelamento é causa de <b>convolação em falência<\/b> (art. 73, V)."}, {"id": "9", "t": "Convolação da recuperação em falência", "q": ["Convolar = transformar a RJ em falência.", "Causas do art. 73: deliberação da assembleia; não apresentar o plano no prazo; plano não aprovado; descumprimento do plano; descumprimento de parcelamento fiscal; esvaziamento patrimonial.", "Credores de uma classe com 25% do valor dos créditos podem pedir convocação da assembleia (art. 36, §2º)."], "txt": "<b>Convolar<\/b> é transformar a recuperação em falência. O juiz só faz isso nos casos do <b>art. 73<\/b>:\n<b>I)<\/b> a <b>assembleia de credores<\/b> delibera pela falência;\n<b>II)<\/b> a empresa <b>não apresenta o plano<\/b> em 60 dias;\n<b>III)<\/b> o plano <b>não é aprovado<\/b> (nos termos do art. 56, §§4º a 6º) ou o plano dos credores é rejeitado;\n<b>IV)<\/b> a empresa <b>descumpre<\/b> obrigação do plano aprovado;\n<b>V)<\/b> <b>descumpre o parcelamento fiscal<\/b> (art. 68) ou a transação do art. 10-C da Lei 10.522/2002;\n<b>VI)<\/b> há <b>esvaziamento patrimonial<\/b> que implique liquidação substancial da empresa, em prejuízo de credores não sujeitos à RJ.\n<b>Quem pede a assembleia para votar a falência:<\/b> credores que representem pelo menos <b>25% do valor dos créditos de uma classe<\/b> podem requerer a convocação da assembleia (art. 36, §2º).\n<b>E depois?<\/b> Os atos feitos durante a RJ, de boa-fé, ficam valendo (art. 74). Os créditos constituídos na RJ ganham tratamento especial (art. 67). Segue-se o processo de falência, que estudamos na próxima parte."}, {"id": "10", "t": "Consolidação processual e substancial", "q": ["Várias empresas do mesmo grupo podem pedir RJ juntas: consolidação processual (art. 69-G), cada uma com o seu patrimônio e o seu plano.", "Consolidação substancial (art. 69-J): trata o grupo como um devedor só; exceção; exige interconexão e confusão de ativos e passivos, mais 2 dos 4 requisitos.", "Efeito: créditos entre as devedoras e garantias fidejussórias extintos (art. 69-K)."], "txt": "<b>Consolidação processual (art. 69-G):<\/b> empresas do mesmo grupo pedem RJ juntas, no mesmo processo, com o mesmo juiz e o mesmo administrador. Mas cada uma continua com <b>seu patrimônio e suas dívidas separadas<\/b>. É só para organizar. O juiz pode ordenar a apresentação de plano único ou de planos separados.\n<b>Consolidação substancial (art. 69-J):<\/b> aqui as empresas viram, na prática, <b>um devedor só<\/b>: ativos e passivos são somados. É <b>exceção<\/b>. O juiz pode autorizá-la, mesmo sem assembleia, quando houver <b>interconexão e confusão entre ativos e passivos<\/b> e, ao mesmo tempo, ao menos <b>2<\/b> destes requisitos: garantias cruzadas; relação de controle ou dependência; identidade total ou parcial do quadro societário; atuação conjunta no mercado.\n<b>Efeitos (art. 69-K):<\/b> somem os créditos que uma devedora tinha contra a outra e as <b>garantias fidejussórias<\/b> (fiança e aval) entre elas. A <b>garantia real<\/b> do credor que não concordou é preservada.\n<b>Dica:<\/b> o simples fato de ser do mesmo grupo não basta. Tem que haver confusão real."}, {"id": "11", "t": "RJ de microempresa, de empresa de pequeno porte e de produtor rural", "q": ["Plano especial para ME/EPP (arts. 70 a 72): só quirografários, até 36 parcelas mensais com correção pela Selic, sem assembleia.", "Produtor rural: atividade empresarial há mais de 2 anos e inscrição na Junta no momento do pedido (STJ, Tema 1.145). Dívidas até R$ 4,8 milhões podem usar o plano especial (art. 70-A).", "Produtor rural pessoa física: só os créditos da atividade rural declarados entram (art. 49, §6º)."], "txt": "<b>ME e EPP (art. 70):<\/b> podem escolher um plano especial. Ele abrange <b>só os créditos quirografários<\/b> (ficam de fora os trabalhistas, os com garantia real e os fiscais). Pagamento em até <b>36 parcelas mensais, iguais e sucessivas<\/b>, com correção pela taxa Selic, sendo a primeira em até 180 dias do pedido. <b>Não há assembleia<\/b>: o juiz concede, a não ser que credores com mais da metade dos créditos objetem. Quem usa o plano especial não pode aumentar despesas nem contratar sem autorização do juiz (art. 72). E o pedido <b>não suspende<\/b> as ações dos credores fora do plano (art. 71, parágrafo único).\n<b>Produtor rural (STJ, Tema 1.145):<\/b> pode pedir RJ se exerce a atividade de forma empresarial há mais de 2 anos e <b>estiver inscrito na Junta Comercial no momento do pedido<\/b>, <b>não importando há quanto tempo<\/b> é inscrito. O prazo de 2 anos é provado, para pessoa física, pelo Livro Caixa Digital e pela declaração de renda (art. 48, §§2º e 3º).\n<b>Só entram na RJ do produtor<\/b> as dívidas da atividade rural, declaradas nesses documentos (art. 49, §6º). O <b>plano especial<\/b> do produtor tem limite de dívidas de <b>R$ 4,8 milhões<\/b> (art. 70-A)."}, {"id": "12", "t": "Recuperação extrajudicial e outros temas", "q": ["Recuperação extrajudicial: acordo com os credores, só depois homologado pelo juiz (arts. 161 a 167).", "Obriga todos os credores da mesma espécie se mais da metade deles aderir; Fisco e, em regra, trabalhistas ficam de fora.", "Outros: mediação (art. 20-A e 20-B), financiamento do devedor em RJ (art. 69-A) e insolvência transnacional (art. 167-A)."], "txt": "<b>Recuperação extrajudicial (RE):<\/b> é a versão 'light'. A empresa negocia direto com os credores e depois pede ao juiz que <b>homologue<\/b> o acordo (art. 161). Pode pedir quem cumpre os requisitos do art. 48.\n<b>Ficam de fora:<\/b> créditos tributários e, em regra, os trabalhistas e os do art. 49, §§3º e 4º. O plano não pode pagar antes uns credores e prejudicar os que não aderiram.\n<b>Quórum:<\/b> se mais da metade dos créditos de cada espécie assinar o plano, ele <b>obriga os demais da mesma espécie<\/b> (art. 163).\n<b>Efeitos:<\/b> o pedido <b>não suspende<\/b> as ações e execuções automaticamente, e não impede pedido de falência feito por credor não abrangido (art. 161, §4º). A sentença de homologação é <b>título executivo judicial<\/b>. Não pode pedir RE quem tem pedido de RJ pendente ou obteve RJ ou RE há menos de 2 anos (art. 161, §3º).\n<b>Outros pontos que caem:<\/b> a <b>mediação e a conciliação<\/b> são permitidas, <b>menos<\/b> para decidir a natureza e a classificação de créditos e os critérios de votação da assembleia (art. 20-B, §2º). O <b>financiamento ao devedor<\/b> durante a RJ pode ser autorizado pelo juiz (art. 69-A). A <b>insolvência transnacional<\/b> (arts. 167-A e seguintes) segue a lei-modelo da ONU para processos com bens em mais de um país."}]}, {"tema": "2. Falência", "itens": [{"id": "13", "t": "O que é falência e quem está sujeito", "q": ["Falência = a empresa insolvente é fechada e o patrimônio é vendido para pagar os credores, na ordem da lei.", "Vale para empresário e sociedade empresária (art. 1º da Lei 11.101/2005).", "Juízo universal: todas as dívidas e ações sobre o patrimônio vão para o juízo da falência (art. 76)."], "txt": "<b>Falência<\/b> é o 'fim da linha': a empresa não consegue pagar, o juiz decreta a quebra, afasta o dono da administração, vende tudo e divide o dinheiro entre os credores, seguindo uma fila (art. 75).\n<b>Quem pode falir:<\/b> empresário individual e sociedade empresária (art. 1º). Ficam de fora os mesmos do art. 2º: empresa pública, sociedade de economia mista, banco, seguradora, plano de saúde etc. Sociedade simples e associação também não.\n<b>Juízo competente (art. 3º):<\/b> o da comarca do <b>principal estabelecimento<\/b> do devedor, isto é, onde está o centro das decisões e dos negócios. Se a sede da empresa estrangeira fica fora do Brasil, vale a filial no país.\n<b>Juízo universal (art. 76):<\/b> todas as ações sobre bens e interesses da massa falida correm no juízo da falência. <b>Exceções:<\/b> ações sem valor definido (quantia ilíquida), causas trabalhistas, execuções fiscais e causas em que a massa é autora ou litisconsorte.\n<b>Massa falida:<\/b> o conjunto de bens e dívidas da empresa falida. Quem fala por ela em juízo é o administrador judicial."}, {"id": "14", "t": "Como começa: pedido de falência e depósito elisivo", "q": ["Três hipóteses do art. 94: impontualidade, execução frustrada e atos de falência.", "Impontualidade: título protestado superior a 40 salários-mínimos, sem pagar, no vencimento, e sem relevante razão de direito.", "O devedor pode fazer o depósito elisivo (valor + correção + juros + honorários) e evitar a falência."], "txt": "O pedido de falência pode ser feito pelo próprio devedor (autofalência, art. 105), pelo cônjuge, herdeiros, sócio ou <b>por credor<\/b> (art. 97).\n<b>Quando o credor pode pedir (art. 94):<\/b>\n<b>I) Impontualidade injustificada:<\/b> dívida em título executivo, protestado, <b>acima de 40 salários-mínimos<\/b> (pode somar vários títulos), não paga sem relevante razão de direito. A soma de títulos é permitida.\n<b>II) Execução frustrada:<\/b> o devedor foi executado e não pagou, não depositou e não nomeou bens à penhora. Nesse caso <b>não importa o valor<\/b>.\n<b>III) Atos de falência:<\/b> o devedor pratica atos que indicam quebra, como liquidar de forma precipitada ou fraudulenta, vender bens para enganar credores ou abandonar o estabelecimento.\n<b>Defesa:<\/b> o devedor tem <b>10 dias<\/b> para responder (art. 98). Pode fazer o <b>depósito elisivo<\/b>: depositar o valor da dívida com correção, juros e honorários. Com isso, o pedido não prospera. Só vale nas hipóteses I e II. Se o devedor contesta, depositando, e vence, quem pediu paga indenização se agiu com dolo (art. 101).\n<b>Fique esperto:<\/b> não se pede falência com base em crédito de execução fiscal."}, {"id": "15", "t": "A sentença que decreta a falência", "q": ["Marca o início do processo falimentar e fixa o termo legal (até 90 dias antes do pedido).", "Contém: nomeação do administrador judicial, prazo de habilitação (15 dias), proibição de atos sobre o patrimônio, lacração e outros (art. 99).", "Recurso: agravo de instrumento (art. 100). Se a falência foi pedida por credor e é rejeitada, cabe apelação."], "txt": "A <b>sentença de falência<\/b> (art. 99) faz muita coisa de uma vez:\n<b>1)<\/b> fixa o <b>termo legal<\/b>, o período suspeito, que não pode retroagir mais de <b>90 dias<\/b> contados do pedido de falência, do pedido de recuperação judicial ou do primeiro protesto por falta de pagamento (excluídos os protestos cancelados);\n<b>2)<\/b> manda o falido apresentar a <b>relação de credores<\/b> em 5 dias;\n<b>3)<\/b> fixa <b>prazo de 15 dias<\/b> para os credores apresentarem seus pedidos de habilitação;\n<b>4)<\/b> <b>suspende<\/b> as ações e execuções contra o falido (exceções do art. 6º);\n<b>5)<\/b> proíbe qualquer ato de disposição ou oneração de bens sem autorização;\n<b>6)<\/b> nomeia o <b>administrador judicial<\/b>;\n<b>7)<\/b> determina a <b>lacração<\/b> do estabelecimento (se for o caso) e a <b>arrecadação<\/b> dos bens;\n<b>8)<\/b> manda <b>intimar o Ministério Público<\/b> e comunicar as Fazendas.\n<b>Recurso (art. 100):<\/b> da sentença que decreta, cabe <b>agravo de instrumento<\/b>. Da que julga improcedente o pedido, cabe <b>apelação<\/b>."}, {"id": "16", "t": "Efeitos da falência sobre o falido e os sócios", "q": ["O falido perde a administração dos bens e fica inabilitado para a atividade empresarial até a extinção das obrigações (art. 102).", "Tem deveres (art. 104): comparecer em juízo, entregar livros, não se ausentar sem aviso etc.", "Sócios de responsabilidade ilimitada também são atingidos (art. 81); responsabilidade dos administradores se apura em ação própria, prazo de 2 anos (art. 82)."], "txt": "<b>O falido:<\/b> perde o direito de administrar seus bens e deles dispor (art. 103) e fica <b>inabilitado<\/b> para exercer atividade empresarial a partir da decretação até a sentença que extingue suas obrigações (art. 102). Não perde a titularidade dos bens; perde a gestão. Tem o dever de colaborar (art. 104): assinar termo de comparecimento, entregar livros e bens, não se ausentar sem autorização, comparecer a atos e outros.\n<b>Sócios:<\/b> a falência da sociedade com <b>sócios de responsabilidade ilimitada<\/b> (como na sociedade em nome coletivo) atinge também esses sócios: eles ficam sujeitos aos mesmos efeitos (art. 81). Sócio de responsabilidade limitada não falece com a empresa.\n<b>Responsabilidade dos sócios e administradores (art. 82):<\/b> apura-se na própria falência, por <b>ação de responsabilidade<\/b>, prescrevendo em <b>2 anos<\/b> contados do trânsito em julgado da sentença de encerramento da falência. O juiz pode ordenar medida cautelar de indisponibilidade de bens do réu (art. 82, §2º).\n<b>Atenção:<\/b> a <b>desconsideração da personalidade jurídica<\/b> na falência segue o CPC (arts. 133 a 137), com incidente próprio (art. 82-A: é <b>vedada<\/b> a extensão de efeitos da falência aos sócios sem ela)."}, {"id": "17", "t": "Efeitos da falência sobre os contratos", "q": ["Regra geral: a falência não resolve os contratos bilaterais; o administrador judicial decide cumprir ou não (art. 117).", "Contratos unilaterais: podem ser cumpridos se reduzirem ou evitarem aumento do passivo (art. 118).", "Regras especiais: venda com reserva de domínio, compra a termo de bens com cotação em bolsa, mandato, conta-corrente e outros (arts. 119 a 128)."], "txt": "Quando a empresa quebra, o que acontece com os contratos que ela firmou? A resposta é: <b>depende do administrador judicial<\/b>.\n<b>Contratos bilaterais (art. 117):<\/b> <b>não se resolvem<\/b> pela falência. O administrador pode, com autorização do comitê de credores, <b>cumprir<\/b> o contrato se isso reduzir ou evitar o aumento do passivo da massa ou for necessário à manutenção e preservação de seus ativos. O contratante pode interpelar o administrador, em até 90 dias, para que declare se cumpre ou não o contrato.\n<b>Contratos unilaterais (art. 118):<\/b> o administrador também pode cumprir, se isso reduzir ou evitar o aumento do passivo da massa ou for necessário à preservação dos ativos.\n<b>Regras especiais (art. 119):<\/b>\n<b>1)<\/b> Venda com <b>reserva de domínio<\/b>: o administrador decide se continua ou não.\n<b>2)<\/b> Venda de coisa em trânsito: o comprador pode recusar a mercadoria entregue após a falência.\n<b>3)<\/b> Contratos de <b>compra e venda a termo<\/b> de bens com cotação em bolsa: liquidam-se pela diferença.\n<b>4)<\/b> <b>Mandato<\/b> conferido para negócio pela massa: cessa pela falência do mandante (art. 120).\n<b>5)<\/b> <b>Contrato de conta-corrente<\/b>: encerra-se pela falência (art. 121).\n<b>Atenção:<\/b> contratos de trabalho seguem regras trabalhistas (a empresa que cessa atividade rescinde)."}, {"id": "18", "t": "Pedido de restituição", "q": ["Quem é dono de bem que está com o falido pede de volta: o bem não é da massa (art. 85).", "Se o bem não existe mais, recebe o valor em dinheiro, antes dos credores comuns (arts. 84 e 86).", "Também se restitui o dinheiro do ACC (adiantamento de câmbio) e as coisas vendidas a crédito entregues ao falido nos 15 dias antes do pedido de falência (art. 85, parágrafo único)."], "txt": "Você emprestou sua bicicleta a um amigo e ele <b>faliu<\/b>. A bicicleta continua sendo sua, e não vai para a venda. É isso o <b>pedido de restituição<\/b> (art. 85): quem prova ser <b>dono<\/b> de bem que está em poder do falido pode pedi-lo de volta, porque ele nunca fez parte da massa.\n<b>Vendas a crédito (art. 85, parágrafo único):<\/b> também se pode pedir de volta a coisa vendida a crédito e entregue ao falido nos <b>15 dias anteriores ao pedido de falência<\/b>, se ainda não foi revendida.\n<b>Restituição em dinheiro (art. 86):<\/b> quando a devolução do próprio bem não é possível, o credor recebe o valor. Casos:\n<b>I)<\/b> a coisa <b>não existe mais<\/b>: recebe o valor da avaliação ou o preço da venda, atualizados;\n<b>II)<\/b> valores entregues por <b>adiantamento de contrato de câmbio (ACC)<\/b> para exportação;\n<b>III)<\/b> valores entregues por <b>contratante de boa-fé<\/b>, se o contrato for revogado ou declarado ineficaz;\n<b>IV)<\/b> tributos retidos na fonte e não repassados à <b>Fazenda<\/b>.\n<b>Prioridade:<\/b> as restituições em dinheiro são pagas logo no início (art. 84), antes da fila do art. 83.\n<b>Súmula 417 do STF:<\/b> pode ser restituído o dinheiro em poder do falido, recebido em nome de outrem, ou do qual ele não tinha a disponibilidade por lei ou contrato."}, {"id": "19", "t": "Ineficácia e revocatória: os atos suspeitos", "q": ["Ineficácia (art. 129): atos ineficazes de pleno direito, sem precisar provar fraude. Reconhecida pelo juiz de ofício, por petição ou por ação.", "Revocatória (art. 130): precisa provar conluio fraudulento e prejuízo à massa. Exige ação própria.", "Prazo da revocatória: 3 anos da decretação da falência (art. 132)."], "txt": "Perto da falência, o dono pode tentar 'esconder' patrimônio. A lei reage de dois jeitos.\n<b>1) Ineficácia objetiva (art. 129):<\/b> o ato é ineficaz perante a massa, <b>mesmo sem fraude<\/b> e <b>sem importar o conhecimento do outro lado<\/b>. Exemplos:\n<b>I)<\/b> pagar dívida <b>ainda não vencida<\/b> dentro do termo legal;\n<b>II)<\/b> pagar dívida vencida por modo diferente do combinado (ex.: dar um imóvel em pagamento);\n<b>III)<\/b> criar <b>garantia real<\/b> para dívida antiga dentro do termo legal;\n<b>IV)<\/b> atos <b>gratuitos<\/b> (doações) até 2 anos antes da falência;\n<b>V)<\/b> renúncia a herança ou legado até 2 anos antes;\n<b>VI)<\/b> venda do estabelecimento sem pagar todos os credores nem a concordância deles (trespasse).\nA ineficácia é declarada pelo juiz de ofício, a pedido ou como defesa, ou por ação própria (art. 129, parágrafo único).\n<b>2) Ação revocatória (art. 130):<\/b> atingem-se atos feitos com a intenção de prejudicar credores, <b>provando-se o conluio fraudulento<\/b> entre o devedor e o terceiro e o <b>efetivo prejuízo à massa<\/b>. Precisa de <b>ação própria<\/b>, no prazo de <b>3 anos<\/b> da decretação da falência (art. 132), proposta pelo administrador judicial, por qualquer credor ou pelo MP."}, {"id": "20", "t": "Administrador judicial, comitê e assembleia na falência", "q": ["Administrador judicial: fiscal e representante da massa, nomeado pelo juiz (preferência para advogado, economista, administrador ou contador, ou empresa especializada).", "Comitê de credores: facultativo; 4 classes de representantes (art. 26).", "Remuneração do administrador: até 5% do valor devido aos credores na RJ ou do valor de venda dos bens na falência (art. 24, §1º); 40% retidos até a prestação de contas."], "txt": "<b>Administrador judicial (art. 21):<\/b> é o braço direito do juiz. Preferencialmente advogado, economista, administrador de empresas ou contador, ou ainda pessoa jurídica especializada. Não pode ser quem, nos últimos 5 anos, foi destituído, deixou de prestar contas ou teve contas rejeitadas, nem parente ou inimigo do devedor (art. 30). Na falência (art. 22, III), cuida de arrecadar bens, representar a massa, verificar créditos, praticar atos de conservação e alienação, e prestar contas.\n<b>Remuneração (art. 24):<\/b> fixada pelo juiz, <b>até 5%<\/b> sobre o valor devido aos credores na RJ ou sobre o valor de venda dos bens na falência. <b>40%<\/b> ficam reservados para pagar só depois da aprovação das contas e do relatório final (§2º). Nas ME e EPP, limite de 2%.\n<b>Comitê de credores (art. 26):<\/b> <b>facultativo<\/b>. Se houver, tem representantes de quatro classes: trabalhistas (1 + 2 suplentes), garantia real (1 + 2), quirografários e privilegiados (1 + 2) e ME e EPP (1 + 2). Fiscaliza o administrador e as atividades do devedor.\n<b>Assembleia geral de credores:<\/b> as mesmas classes e regras de voto do capítulo da RJ. Na falência, o quórum de deliberação para realização do ativo é mais da metade do valor total dos créditos presentes (art. 42)."}, {"id": "21", "t": "Verificação e habilitação de créditos", "q": ["Habilitação: o credor pede seu crédito ao administrador judicial em 15 dias da publicação do edital (art. 7º, §1º).", "Impugnação: 10 dias após a lista do administrador, direto ao juiz (art. 8º).", "Habilitação retardatária: só até 3 anos da sentença de falência, sob pena de decadência (art. 10, §10)."], "txt": "Como o credor 'entra na fila'? Pela <b>verificação de créditos<\/b> (arts. 7º a 20).\n<b>1) Habilitação ou divergência:<\/b> em <b>15 dias<\/b> da publicação do edital com a lista de credores, o credor manda ao <b>administrador judicial<\/b> o pedido de habilitação ou a divergência de valor ou classificação (art. 7º, §1º). Ainda é fase administrativa, sem juiz.\n<b>2) Lista do administrador:<\/b> em <b>45 dias<\/b> depois, o administrador publica a sua lista (art. 7º, §2º).\n<b>3) Impugnação (art. 8º):<\/b> em <b>10 dias<\/b> da publicação dessa lista, o Comitê, qualquer credor, o devedor, os sócios ou o MP podem impugnar. Aí o juiz decide.\n<b>4) Quadro-geral de credores (art. 18):<\/b> o administrador o consolida e o juiz o homologa.\n<b>Habilitação retardatária (art. 10):<\/b> quem perde o prazo ainda pode se habilitar. Na falência, <b>perde os rateios<\/b> já feitos, e na RJ não vota em assembleia (salvo os trabalhistas). A habilitação ou a reserva de crédito deve ser pedida em, no máximo, <b>3 anos da publicação da sentença de falência<\/b>, sob pena de <b>decadência<\/b> (art. 10, §10). Habilitações e impugnações retardatárias geram reserva do valor discutido (§8º)."}, {"id": "22", "t": "Classificação dos créditos: a fila do art. 83", "q": ["Antes da fila: restituições e extraconcursais (art. 84).", "Ordem do art. 83: trabalhistas (até 150 SM) → garantia real → tributários → quirografários → multas → subordinados → juros pós-falência.", "Lei 14.112/2020 revogou os incisos IV e V (privilégios especial e geral): esses créditos agora são quirografários (art. 83, §6º)."], "txt": "<b>Antes da fila:<\/b> restituições em dinheiro (art. 86) e <b>extraconcursais<\/b> (art. 84): remuneração do administrador e dos empregados da massa, custas, despesas da arrecadação, tributos gerados depois da falência, entre outros. São pagos primeiro.\n<b>Ordem do art. 83<\/b> (redação da Lei 14.112/2020): veja a tabela.\n<b>Trabalhistas (I):<\/b> limite de <b>150 salários-mínimos por credor<\/b>; o que passar disso vira quirografário. Acidente de trabalho também entra aqui.\n<b>Garantia real (II):<\/b> só até o valor do bem gravado. O saldo vira quirografário.\n<b>Tributários (III):<\/b> todos, <b>independentemente da natureza e do tempo de constituição<\/b>, exceto as multas tributárias, que vão para o inciso VII.\n<b>Incisos IV e V:<\/b> foram <b>revogados<\/b>. Antigos privilégios especial e geral caíram na classe dos quirografários (§6º).\n<b>Subordinados (VIII):<\/b> os previstos em lei ou contrato e os créditos de sócios e administradores sem vínculo empregatício, quando a contratação não seguiu condições de mercado.\n<b>Salários urgentes (art. 151):<\/b> até 5 salários-mínimos por trabalhador, dos 3 meses anteriores, pagos assim que houver dinheiro em caixa.", "tab": {"head": ["Ordem", "Crédito"], "rows": [["1º", "Trabalhistas (até 150 SM) e acidente de trabalho"], ["2º", "Garantia real (até o valor do bem)"], ["3º", "Tributários (exceto multas tributárias)"], ["4º", "Quirografários (inclui os antigos privilégios e o saldo trabalhista acima de 150 SM)"], ["5º", "Multas contratuais e penas pecuniárias, inclusive multas tributárias"], ["6º", "Subordinados"], ["7º", "Juros vencidos após a falência"]]}}, {"id": "23", "t": "Fazenda Pública e falência: o que fica diferente", "q": ["Crédito tributário não precisa se habilitar (art. 187 do CTN) e a execução fiscal não é suspensa pela falência (art. 5º da Lei 6.830/80).", "O dinheiro da venda do bem penhorado vai para o juízo da falência, que paga na ordem do art. 83 (Súmula 44 do TFR; art. 29 da Lei 6.830).", "Na ordem de pagamento, o crédito tributário fica depois dos extraconcursais, das restituições e dos trabalhistas (art. 83, III; art. 186 e 188 do CTN)."], "txt": "O Fisco tem tratamento especial. <b>Não precisa se habilitar:<\/b> a cobrança do crédito tributário não se sujeita a concurso de credores nem a habilitação em falência (art. 187 do CTN).\n<b>A execução fiscal continua<\/b> correndo no juízo próprio, sem suspensão pela falência. Mas o dinheiro da venda dos bens penhorados deve ser entregue ao juízo da falência, para pagar na ordem do art. 83. É o que diz a <b>Súmula 44 do TFR<\/b>.\n<b>Posição na fila:<\/b> o crédito tributário passa à frente dos quirografários, mas fica <b>depois<\/b> das despesas extraconcursais (art. 188 do CTN: os 'créditos extraconcursais' são pagos antes), das restituições e dos <b>créditos trabalhistas<\/b> até 150 salários-mínimos (art. 186 do CTN). Desde a Lei 14.112, também fica <b>atrás da garantia real<\/b>.\n<b>Multas tributárias:<\/b> vão para o inciso VII do art. 83, penúltimo lugar da fila.\n<b>Pegadinha de prova:<\/b> a Fazenda não pede falência com base em dívida tributária: tem a execução fiscal à disposição, e falta o interesse de agir.\n<b>Na RJ:<\/b> o Fisco também fica fora (art. 6º, §7º-B), mas pode ser pressionado a negociar parcelamento (art. 68)."}, {"id": "24", "t": "Venda dos bens e encerramento da falência", "q": ["Arrecadação: o administrador junta todos os bens do falido (art. 108).", "Venda: leilão, propostas fechadas ou pregão (art. 142); sem sucessão nas obrigações do arrematante (art. 141, II).", "Extinção das obrigações do falido (art. 158): pagamento de todos os créditos, pagamento de mais de 25% dos quirografários, 3 anos da decretação ou encerramento da falência."], "txt": "<b>Arrecadação (art. 108):<\/b> logo depois de assinar o termo de compromisso, o administrador recolhe os bens e documentos do falido, lacra o estabelecimento, se preciso, e avalia tudo.\n<b>Realização do ativo (arts. 139 a 148):<\/b> a regra é vender rápido. Modalidades (art. 142): <b>leilão<\/b>, <b>propostas fechadas<\/b> e <b>pregão<\/b>. Prefere-se vender a empresa inteira, ou por estabelecimentos, antes de vender bens isolados (art. 140).\n<b>Ponto muito cobrado:<\/b> quem compra <b>não herda as dívidas<\/b> da falida (art. 141, II): o objeto da venda vem livre de ônus, <b>sem sucessão<\/b>, inclusive nas dívidas trabalhistas e tributárias. Exceção (art. 141, §1º): se o arrematante for <b>sócio da falida, parente ou agente<\/b> dela (laranja), há sucessão.\n<b>Pagamento:<\/b> pela ordem do art. 83.\n<b>Encerramento:<\/b> terminada a venda e o pagamento, o administrador presta contas e o juiz profere a <b>sentença de encerramento<\/b> (arts. 154 a 156).\n<b>Extinção das obrigações do falido (art. 158):<\/b> o falido volta a poder empresariar quando o juiz declara extintas suas obrigações. Hipóteses, hoje: <b>I)<\/b> pagamento de todos os créditos; <b>II)<\/b> pagamento de <b>mais de 25%<\/b> dos quirografários, depois de vendido todo o ativo (pode depositar a diferença); <b>V)<\/b> decurso de <b>3 anos<\/b> da decretação da falência; <b>VI)<\/b> encerramento da falência. Os incisos III e IV foram revogados."}]}, {"tema": "3. Sociedades: tipos e sociedade limitada", "itens": [{"id": "25", "t": "Sociedade empresária, simples e personificada ou não", "q": ["Sociedade empresária: explora atividade própria de empresário e se registra na Junta Comercial. Sociedade simples: atividade intelectual e afins, registro no Cartório de Pessoas Jurídicas.", "Sociedade por ações é sempre empresária, mesmo que a atividade seja outra (art. 982, parágrafo único, CC).", "Sociedade não personificada: em comum e em conta de participação. Personificada: todas as outras."], "txt": "Todo mundo que se junta para empreender forma uma <b>sociedade<\/b>. O Código Civil as separa em dois grupos (art. 981 e seguintes):\n<b>Sociedade empresária:<\/b> exerce atividade própria de empresário (produzir ou circular bens ou serviços de forma organizada). Registra-se na <b>Junta Comercial<\/b>.\n<b>Sociedade simples:<\/b> atividade de natureza intelectual, científica, literária ou artística (a regra do art. 966, parágrafo único), como um consultório ou um escritório de advocacia. Registra-se no <b>Registro Civil de Pessoas Jurídicas<\/b>.\n<b>Regra de ouro (art. 982, parágrafo único):<\/b> a <b>sociedade por ações<\/b> é <b>sempre empresária<\/b>, e a <b>cooperativa<\/b> é <b>sempre simples<\/b>, seja qual for o seu objeto.\n<b>Personificada x não personificada:<\/b> a sociedade só ganha personalidade jurídica (vira 'pessoa') depois do <b>registro<\/b> do ato constitutivo (art. 985). Antes disso, ou se nunca for registrada, é a sociedade <b>em comum<\/b>. A sociedade <b>em conta de participação<\/b> nunca tem personalidade (art. 993).\n<b>Registro:<\/b> se não registrada, a sociedade fica sem personalidade e seus sócios respondem pessoalmente (próximo tópico)."}, {"id": "26", "t": "Sociedade em comum e sociedade em conta de participação", "q": ["Em comum: sociedade sem registro. Todos os sócios respondem de forma ilimitada e solidária (art. 990).", "Quem contratou pela sociedade perde o benefício de ordem (art. 990).", "Em conta de participação: o sócio ostensivo age em nome próprio e responde sozinho perante terceiros; o participante fica oculto (arts. 991 a 996)."], "txt": "<b>Sociedade em comum (arts. 986 a 990):<\/b> é a sociedade que ainda não registrou seu contrato, ou nunca registrou (a famosa 'sociedade de fato' ou 'irregular').\n<b>Responsabilidade:<\/b> os bens sociais respondem pelas dívidas, e os sócios respondem <b>solidária e ilimitadamente<\/b> com seus bens pessoais. Eles têm o <b>benefício de ordem<\/b> (exigir que primeiro sejam executados os bens da sociedade), mas <b>quem contratou em nome da sociedade não tem esse benefício<\/b> (art. 990).\n<b>Prova:<\/b> entre os sócios, a existência da sociedade só se prova por escrito. Perante terceiros, prova-se por qualquer meio (art. 987).\n<b>Sociedade em conta de participação (art. 991):<\/b> há dois tipos de sócio. O <b>sócio ostensivo<\/b> exerce a atividade em nome próprio e <b>responde sozinho<\/b> perante terceiros. O <b>sócio participante<\/b> fica nos bastidores e responde apenas perante o ostensivo, nos termos do contrato. Não tem personalidade jurídica e <b>não tem razão social<\/b>. O contrato <b>só produz efeito entre os sócios<\/b>. A inscrição do contrato em qualquer registro não confere personalidade (art. 993).\n<b>Falência:<\/b> se o ostensivo falir, a sociedade se dissolve. Se o participante falir, o contrato se sujeita às normas da falência (art. 994, §§ 2º e 3º)."}, {"id": "27", "t": "Sociedade simples, nome coletivo e comandita simples", "q": ["Sociedade simples: sócios respondem subsidiariamente pelas dívidas, na proporção de sua participação nas perdas (art. 1.023).", "Nome coletivo: só pessoas físicas; todos respondem solidária e ilimitadamente (art. 1.039).", "Comandita simples: comanditados (ilimitada, administram) e comanditários (limitada à cota, não administram)."], "txt": "<b>Sociedade simples (arts. 997 a 1.038):<\/b> o contrato é escrito. Se o patrimônio da sociedade não cobrir as dívidas, os sócios respondem pelo saldo, <b>subsidiariamente<\/b>, na proporção da participação nas perdas (art. 1.023), salvo cláusula de responsabilidade solidária. É o modelo supletivo: quando o contrato da limitada silenciar, aplica-se a sociedade simples (art. 1.053).\n<b>Sociedade em nome coletivo (art. 1.039):<\/b> só <b>pessoas físicas<\/b> podem ser sócias. Todos respondem <b>solidária e ilimitadamente<\/b> pelas dívidas, mas podem limitar entre si a responsabilidade. A administração cabe exclusivamente a sócios. Usa <b>firma<\/b> (nome dos sócios).\n<b>Sociedade em comandita simples (art. 1.045):<\/b> tem dois tipos de sócio. <b>Comanditados<\/b> (pessoas físicas): responsabilidade <b>ilimitada e solidária<\/b>, e só eles administram. <b>Comanditários<\/b>: respondem <b>só pelo valor da sua cota<\/b>, e <b>não podem administrar<\/b>, nem ser procuradores da sociedade (art. 1.047). Se o comanditário praticar ato de gestão, passa a responder como sócio de responsabilidade ilimitada.\n<b>Firma:<\/b> as sociedades de nome coletivo e de comandita simples usam firma, e na comandita só os comanditados nela figuram (art. 1.046)."}, {"id": "28", "t": "Limitada: o que é, capital e responsabilidade", "q": ["Responsabilidade dos sócios: restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital (art. 1.052).", "Sócio responde por 5 anos, solidariamente, pela exata estimação de bens conferidos ao capital (art. 1.055, §1º).", "Pode ser unipessoal (art. 1.052, §1º, CC; Lei 13.874/2019)."], "txt": "A <b>sociedade limitada<\/b> é a mais comum do Brasil. A palavra 'limitada' quer dizer que a responsabilidade do sócio tem um teto.\n<b>Regra (art. 1.052):<\/b> cada sócio responde só pelo valor de suas quotas, <b>mas<\/b> todos respondem <b>solidariamente pela integralização do capital social<\/b>. Ou seja: enquanto o capital não estiver todo pago, um sócio pode ser cobrado pelo que falta de outro.\n<b>Bens conferidos:<\/b> se o sócio entra com um bem (um imóvel, por exemplo) avaliado acima do valor real, todos os sócios respondem solidariamente pela estimação exata, durante <b>5 anos<\/b> da data do registro (art. 1.055, §1º).\n<b>Sócio remisso (art. 1.004 e 1.058):<\/b> o que não paga sua quota pode ser excluído, ou ter a quota tomada pelos outros, ou reduzida ao que pagou.\n<b>Unipessoal:<\/b> desde a Lei 13.874/2019 (Lei da Liberdade Econômica), a limitada pode ter <b>um único sócio<\/b> (art. 1.052, §1º). Existe ainda a <b>EIRELI<\/b>, extinta pela Lei 14.382/2022 (as existentes foram transformadas em sociedades limitadas unipessoais).\n<b>Regência supletiva (art. 1.053):<\/b> se o contrato for omisso, aplicam-se as regras da sociedade simples. Mas o contrato pode prever a aplicação supletiva da Lei das S/A."}, {"id": "29", "t": "Quotas: cessão, penhora e direitos", "q": ["Cessão para outro sócio: livre, sem anuência (art. 1.057).", "Cessão para estranho: vale se não houver oposição de titulares de mais de 1/4 do capital, salvo disposição contratual diversa.", "O credor particular do sócio só pode penhorar os lucros e a quota; mas a sociedade tem preferência para adquiri-la (art. 1.026)."], "txt": "As <b>quotas<\/b> são as 'fatias' do capital. Quem as tem é <b>sócio<\/b>.\n<b>Cessão de quotas (art. 1.057):<\/b> o sócio pode ceder a quota <b>a outro sócio<\/b> sem precisar de autorização de ninguém. Para ceder a um <b>estranho<\/b>, é preciso que <b>sócios titulares de mais de 1/4 do capital não se oponham<\/b>. O contrato pode mudar essa regra. A cessão só produz efeito perante a sociedade depois da averbação e da comunicação formal (art. 1.057, parágrafo único).\n<b>Cedente e cessionário:<\/b> o cedente responde solidariamente com o cessionário, por 2 anos após a averbação, pelas obrigações que tinha como sócio (art. 1.003, parágrafo único).\n<b>Penhora (art. 1.026):<\/b> o credor <b>particular<\/b> do sócio não pode tomar bens da sociedade. Só pode executar os <b>lucros<\/b> ou a <b>quota<\/b> do sócio, Se a sociedade não está dissolvida, o credor pode pedir a <b>liquidação da quota<\/b> (parágrafo único), o que preserva o convívio dos demais sócios.\n<b>Direitos do sócio:<\/b> votar, receber lucros, fiscalizar a gestão, participar do acervo na liquidação e <b>retirar-se<\/b> (próximo tópico)."}, {"id": "30", "t": "Administração e conselho fiscal na limitada", "q": ["Administrador: um ou mais, sócios ou não; designados no contrato ou em ato separado (art. 1.060).", "Administrador não sócio: unanimidade enquanto o capital não estiver integralizado; depois, mais da metade do capital (art. 1.061, Lei 14.451/2022).", "Conselho fiscal: facultativo (art. 1.066)."], "txt": "<b>Quem administra (art. 1.060):<\/b> uma ou mais pessoas, <b>sócias ou não<\/b>, designadas no contrato ou em ato separado. O uso da firma ou da denominação cabe aos administradores. O administrador responde perante a sociedade e terceiros pelos atos praticados com excesso de poderes ou violação da lei ou do contrato (art. 1.016).\n<b>Administrador que não é sócio (art. 1.061):<\/b> a designação depende de aprovação de <b>todos os sócios<\/b>, enquanto o capital <b>não estiver integralizado<\/b>, e de <b>mais da metade do capital social<\/b> depois que estiver integralizado. (Antes da Lei 14.451/2022 eram 2/3.)\n<b>Destituição (art. 1.063, §1º):<\/b> o administrador sócio, nomeado no contrato, é destituído pela aprovação de titulares de <b>mais da metade do capital<\/b>, salvo cláusula diferente. O administrador nomeado em ato separado pode ser destituído a qualquer tempo, pelos votos correspondentes a mais da metade do capital social (art. 1.076, II).\n<b>Conselho fiscal (art. 1.066):<\/b> é <b>facultativo<\/b>: o contrato pode instituí-lo. Tem 3 ou mais membros e respectivos suplentes, sócios ou não, residentes no Brasil.\n<b>Lucros:<\/b> os sócios respondem solidariamente pela reposição dos lucros e quantias retiradas à conta de lucros <b>ilícitos<\/b> ou fictícios (art. 1.059)."}, {"id": "31", "t": "Deliberações dos sócios: reunião, assembleia e quóruns", "q": ["Assembleia obrigatória se a sociedade tiver mais de 10 sócios; senão, basta reunião (art. 1.072, §1º).", "Mais da metade do capital: alterar o contrato, incorporação, fusão, dissolução, designação e destituição de administradores etc. (art. 1.076, II, Lei 14.451/2022).", "Reunião anual nos 4 primeiros meses após o fim do exercício (art. 1.078)."], "txt": "Os sócios decidem em <b>reunião<\/b> (menos formal) ou em <b>assembleia<\/b> (mais formal). A <b>assembleia<\/b> é obrigatória quando há <b>mais de 10 sócios<\/b> (art. 1.072, §1º). Também pode haver deliberação sem reunião, se todos os sócios decidirem por escrito sobre a matéria (§3º).\n<b>Reunião anual (art. 1.078):<\/b> nos <b>4 meses seguintes<\/b> ao fim do exercício social, para aprovar contas dos administradores, designar administradores e tratar de outros assuntos.\n<b>Quóruns (art. 1.076, depois da Lei 14.451/2022):<\/b>\n<b>Mais da metade do capital social:<\/b> aprovação do que o art. 1.071 lista (contas, designação e destituição de administradores, modo de remuneração, <b>modificação do contrato<\/b>, <b>incorporação, fusão, dissolução<\/b> ou fim da liquidação, nomeação de liquidantes, pedido de recuperação judicial).\n<b>Maioria dos presentes:<\/b> nas demais matérias, se o contrato não exigir mais.\n<b>Antes de 2022<\/b> havia o quórum de <b>3/4<\/b> do capital para alterar o contrato e para as operações de incorporação, fusão e dissolução. A Lei 14.451 <b>revogou<\/b> esse inciso.\n<b>Resumo cobrado em prova:<\/b> hoje basta <b>mais da metade do capital<\/b> (não da quantidade de sócios).\n<b>Quórum de instalação:<\/b> em 1ª convocação, titulares de no mínimo 3/4 do capital; em 2ª, qualquer número (art. 1.074)."}, {"id": "32", "t": "Direito de retirada e exclusão de sócio", "q": ["Retirada: em sociedade por prazo indeterminado, o sócio notifica os demais com 60 dias de antecedência (art. 1.029).", "Recesso: o sócio dissidente da modificação do contrato, fusão ou incorporação pode se retirar em 30 dias (art. 1.077).", "Exclusão por justa causa (art. 1.085): maioria dos sócios, mais da metade do capital, com direito de defesa."], "txt": "<b>Retirada (art. 1.029):<\/b> sociedade por <b>prazo indeterminado<\/b>: o sócio pode sair a qualquer tempo, notificando os demais com <b>60 dias de antecedência<\/b>. Sociedade por prazo determinado: só se provar justa causa judicialmente.\n<b>Recesso (art. 1.077):<\/b> quando houver modificação do contrato, fusão ou incorporação e o sócio <b>discordar<\/b>, pode se retirar em <b>30 dias<\/b> da reunião. A sociedade deve pagar a quota, apurada em balanço especial.\n<b>Exclusão por falta grave (art. 1.085):<\/b> a maioria dos sócios, <b>representativa de mais da metade do capital<\/b>, pode excluir um sócio que esteja pondo em risco a continuidade da empresa, desde que o contrato <b>preveja a exclusão por justa causa<\/b>. Exige <b>reunião ou assembleia especialmente convocada<\/b>, com ciência do acusado e <b>direito de defesa<\/b>. Em sociedade de 2 sócios, não há como excluir por essa via (só judicialmente).\n<b>Exclusão do remisso (art. 1.004, parágrafo único):<\/b> sócio que não paga a quota, depois de notificado.\n<b>Apuração dos haveres (art. 1.031):<\/b> o valor da quota é o que o sócio receberia se a sociedade fosse liquidada na data da saída, em dinheiro, em 90 dias (salvo contrato). O CPC (art. 606) manda considerar o valor patrimonial, apurado em balanço de determinação."}, {"id": "33", "t": "Dissolução da sociedade e quando ela continua", "q": ["Dissolução total (art. 1.033): vencimento do prazo, consenso unânime, deliberação da maioria absoluta se prazo indeterminado, falta de pluralidade de sócios não reconstituída em 180 dias, extinção da autorização.", "Dissolução parcial: morte, retirada, exclusão de sócio; o CPC trata no art. 599 em diante.", "Princípio da preservação da empresa: o juiz prefere dissolver parcialmente."], "txt": "<b>Dissolução total (art. 1.033):<\/b> a sociedade acaba quando: <b>I)<\/b> vence o prazo e não prorroga; <b>II)<\/b> todos os sócios consentem; <b>III)<\/b> maioria absoluta dos sócios decide, se o prazo for indeterminado; <b>IV)<\/b> <b>falta de pluralidade de sócios<\/b> não reconstituída em <b>180 dias<\/b> (a limitada pode ser unipessoal, então a regra vale para os outros tipos); <b>V)<\/b> extingue-se a autorização, se necessária.\n<b>Dissolução judicial (art. 1.034):<\/b> quando anulada a constituição, quando o objeto não pode ser alcançado, ou quando a sociedade é inexequível.\n<b>Dissolução parcial:<\/b> o sócio sai, mas a sociedade segue. Cabe por morte, retirada ou exclusão (arts. 599 a 609 do CPC). Pode ser pedida por sócio, pela própria sociedade e, em certos casos, pelo espólio e herdeiros.\n<b>Preservação da empresa:<\/b> se a sociedade tem função social (empregos, produção), o juiz prefere a dissolução parcial à total.\n<b>Liquidação (arts. 1.102 a 1.112):<\/b> depois da dissolução vem a liquidação: o liquidante vende o ativo, paga os credores e divide o que sobra entre os sócios."}, {"id": "34", "t": "Transformação, incorporação, fusão e cisão", "q": ["Transformação: muda o tipo societário sem dissolver nem liquidar (art. 1.113). Exige unanimidade, salvo disposição contratual.", "Incorporação: uma sociedade absorve outra, que desaparece. Fusão: duas ou mais se unem e formam outra nova. Cisão: divide-se o patrimônio.", "Credores podem pedir a anulação da incorporação ou fusão em 90 dias (art. 1.122)."], "txt": "<b>Transformação (arts. 1.113 a 1.115):<\/b> a sociedade muda de tipo (por exemplo, de limitada para S/A), <b>sem dissolver nem liquidar<\/b>. Depende do consentimento <b>unânime<\/b> dos sócios, salvo se o contrato já a previr, caso em que o sócio dissidente pode se retirar (art. 1.114). Os credores mantêm todos os seus direitos (art. 1.115).\n<b>Incorporação (art. 1.116):<\/b> uma sociedade <b>absorve<\/b> outra, que <b>deixa de existir<\/b>. A incorporadora sucede em todos os direitos e obrigações.\n<b>Fusão (art. 1.119):<\/b> duas ou mais sociedades <b>se unem para formar uma terceira<\/b>, e as originais desaparecem.\n<b>Cisão (art. 229 da Lei 6.404):<\/b> a sociedade <b>transfere partes do patrimônio<\/b> para outras. Pode ser total (a original se extingue) ou parcial (continua, com patrimônio reduzido). Em regra, as sociedades envolvidas respondem <b>solidariamente<\/b> pelas obrigações anteriores à cisão (art. 233); pode-se estipular que cada uma responda só pelas obrigações que recebeu, e então o credor anterior pode se opor em 90 dias.\n<b>Oposição dos credores (art. 1.122):<\/b> na incorporação ou fusão, o credor anterior pode pedir a anulação, em <b>90 dias<\/b> da publicação, se prejudicado.\n<b>Quórum na limitada:<\/b> mais da metade do capital (art. 1.076, II)."}]}, {"tema": "4. Desconsideração da personalidade jurídica", "itens": [{"id": "35", "t": "O que é desconsideração e por que existe", "q": ["Regra: a pessoa jurídica tem patrimônio próprio e separado do dos sócios (autonomia patrimonial).", "Desconsideração: em caso de abuso, o juiz ignora a separação e atinge os bens dos sócios ou administradores (art. 50 do CC).", "Não extingue a empresa: vale só para aquele caso."], "txt": "Imagine a empresa como uma caixa. O que está dentro é dela, e o que está fora é do sócio. Se a empresa deve, o credor cobra da caixa. Isso é a <b>autonomia patrimonial<\/b>, e é ela que permite empreender sem arriscar a casa e o carro.\nO problema aparece quando alguém <b>usa a caixa para fraudar<\/b>. Aí entra a <b>desconsideração da personalidade jurídica<\/b>: o juiz 'levanta o véu' da empresa e alcança os bens de quem a usou de forma abusiva.\n<b>Pontos importantes:<\/b>\n<b>1)<\/b> É <b>exceção<\/b>. A regra continua sendo a separação de patrimônios.\n<b>2)<\/b> <b>Não acaba<\/b> com a empresa. A pessoa jurídica continua existindo, e o efeito vale só para aquele caso (<b>suspensão episódica<\/b> da eficácia).\n<b>3)<\/b> Não é o mesmo que <b>responsabilidade direta<\/b> do sócio ou do administrador, que decorre de lei (por exemplo, o art. 135 do CTN).\n<b>4)<\/b> O <b>art. 50 do Código Civil<\/b> trata da regra geral, com a redação da Lei 13.874/2019. Há regras especiais no CDC (art. 28), na Lei Ambiental (art. 4º da Lei 9.605/98) e na Lei Antitruste (art. 34 da Lei 12.529/2011)."}, {"id": "36", "t": "Teoria maior e teoria menor", "q": ["Teoria maior (art. 50 do CC): exige abuso da personalidade, que se prova por desvio de finalidade ou confusão patrimonial.", "Teoria menor (CDC art. 28, §5º; Lei 9.605/98 art. 4º): basta a pessoa jurídica não ter bens para pagar.", "STJ: no Direito Civil e Empresarial vale a maior; no consumidor e ambiental, a menor."], "txt": "<b>Teoria maior (a regra, art. 50 do CC):<\/b> o juiz só desconsidera se houver <b>abuso da personalidade jurídica<\/b>, caracterizado pelo <b>desvio de finalidade<\/b> ou pela <b>confusão patrimonial<\/b>. A simples falta de dinheiro da empresa <b>não basta<\/b>. É a posição do Direito Civil e Empresarial.\n<b>Teoria menor (exceção):<\/b> basta provar que a pessoa jurídica <b>não tem bens<\/b> para pagar a dívida, e que isso é obstáculo ao ressarcimento do prejuízo. Não precisa provar fraude. Está no <b>art. 28, §5º, do CDC<\/b> e no <b>art. 4º da Lei 9.605/98<\/b> (crimes ambientais). Também é usada no Direito do Trabalho.\n<b>Como o STJ decide:<\/b> aplica a <b>teoria maior<\/b> em relações empresariais e civis comuns; a <b>menor<\/b> quando a relação é de consumo ou de dano ambiental.\n<b>Resumo:<\/b> maior = prova de abuso. Menor = prova de insolvência."}, {"id": "37", "t": "Art. 50 do CC: desvio de finalidade e confusão patrimonial", "q": ["Desvio de finalidade: usar a pessoa jurídica com o propósito de lesar credores ou praticar atos ilícitos de qualquer natureza.", "Confusão patrimonial: ausência de separação de fato entre o patrimônio da sociedade e o do sócio.", "Mera existência de grupo econômico ou mera expansão do objeto não bastam (§§ 4º e 5º)."], "txt": "O <b>art. 50 do CC<\/b> (Lei 13.874/2019) explica o que é abuso:\n<b>Desvio de finalidade (§1º):<\/b> é a utilização da pessoa jurídica com o <b>propósito de lesar credores<\/b> e para a prática de atos ilícitos de qualquer natureza.\n<b>Confusão patrimonial (§2º):<\/b> é a <b>ausência de separação de fato<\/b> entre os patrimônios, caracterizada por:\n<b>I)<\/b> cumprimento repetitivo, pela sociedade, de obrigações do sócio ou do administrador, ou vice-versa;\n<b>II)<\/b> transferência de ativos ou de passivos sem efetivas contraprestações, exceto os de valor proporcionalmente insignificante;\n<b>III)<\/b> outros atos de descumprimento da autonomia patrimonial.\n<b>Quem responde:<\/b> só o <b>sócio ou administrador beneficiado, direta ou indiretamente, pelo abuso<\/b> (caput). Ou seja, não é todo sócio automaticamente.\n<b>O que NÃO basta:<\/b> a <b>mera existência de grupo econômico<\/b>, sem os requisitos do caput (§4º); a <b>expansão ou a alteração da finalidade original<\/b> da atividade econômica (§5º).\n<b>Nome engraçado, matéria séria:<\/b> 'laranja' é pessoa posta como sócio para esconder o verdadeiro dono. A desconsideração serve também para alcançá-lo."}, {"id": "38", "t": "Desconsideração inversa", "q": ["Inversa: o sócio esconde seus bens dentro da pessoa jurídica; o juiz atinge o patrimônio da empresa para pagar dívida do sócio.", "Previsão: art. 133, §2º, do CPC e art. 50, §3º, do CC.", "Exemplo clássico: devedor de pensão alimentícia que transfere o patrimônio para a sua empresa."], "txt": "Na desconsideração <b>comum (direta)<\/b>, a dívida é da empresa e o juiz alcança o <b>sócio<\/b>. Na <b>inversa<\/b>, é o contrário: a dívida é do <b>sócio<\/b>, e o juiz alcança o <b>patrimônio da empresa<\/b>.\n<b>Exemplo:<\/b> o pai deve pensão ao filho e passa todos os seus bens para uma empresa da qual é dono. Na execução, o juiz pode desconsiderar a personalidade da empresa, 'ao contrário', e penhorar o patrimônio da pessoa jurídica.\n<b>Previsão legal:<\/b> o <b>CPC<\/b> (art. 133, §2º): o incidente se aplica à <b>hipótese de desconsideração inversa<\/b>. O <b>CC<\/b> (art. 50, §3º): vale também para a extensão das obrigações de sócios ou administradores à pessoa jurídica. O STJ já admitia desde o REsp 948.117, antes da lei.\n<b>Quando cabe:<\/b> quando o devedor <b>transfere bens para a sociedade com abuso<\/b>: desvio de finalidade ou confusão patrimonial, para fraudar credores ou esconder bens. Também cabe em <b>Direito de Família e Sucessões<\/b>, para evitar que um cônjuge esconda patrimônio na separação.\n<b>Cuidado:<\/b> a empresa não pode ser atingida por qualquer dívida do sócio: só quando <b>há abuso<\/b>."}, {"id": "39", "t": "Procedimento: incidente do CPC (arts. 133 a 137)", "q": ["Cabível em todas as fases e na execução de título extrajudicial; pode ser pedido na própria petição inicial (art. 134).", "O processo fica suspenso até a decisão, exceto se pedido na inicial (art. 134, §§ 2º e 3º).", "Sócio ou pessoa jurídica citado tem 15 dias para se manifestar e pedir provas (art. 135). Decisão: agravo de instrumento (art. 1.015, IV)."], "txt": "O <b>CPC<\/b> criou o <b>incidente de desconsideração da personalidade jurídica<\/b> (arts. 133 a 137). Antes dele, o juiz desconsiderava sem ouvir o sócio. Agora, <b>é preciso contraditório<\/b>.\n<b>Quem pede (art. 133):<\/b> a <b>parte<\/b> ou o <b>Ministério Público<\/b>, quando lhe couber intervir. Precisa demonstrar os pressupostos da lei (art. 133, §1º): se for a teoria maior, o abuso; se a menor, a insolvência.\n<b>Quando (art. 134):<\/b> em <b>todas as fases<\/b> do processo de conhecimento, no cumprimento de sentença e na execução de título extrajudicial. Se o pedido já for feito na <b>petição inicial<\/b>, dispensa-se o incidente: o sócio é citado desde o começo (§2º). Se pedido depois, o processo é <b>suspenso<\/b> (§3º).\n<b>Defesa (art. 135):<\/b> o sócio (ou a pessoa jurídica, na inversa) é <b>citado<\/b> e tem <b>15 dias<\/b> para se manifestar e pedir provas.\n<b>Decisão e recurso (art. 136):<\/b> o juiz resolve por <b>decisão interlocutória<\/b>. Cabe <b>agravo de instrumento<\/b> (art. 1.015, IV). Se for decidida pelo relator, cabe agravo interno.\n<b>Fraude à execução (art. 137):<\/b> se o pedido for acolhido, a alienação ou oneração de bens, <b>posterior à citação da parte<\/b> cuja personalidade se desconsidera, é ineficaz perante o requerente.\n<b>Juizados Especiais:<\/b> o incidente é cabível (art. 1.062 do CPC)."}]}, {"tema": "5. Sociedades anônimas (Lei 6.404/1976)", "itens": [{"id": "40", "t": "O que é S/A e a diferença entre aberta e fechada", "q": ["Capital dividido em ações; o acionista responde só pelo preço de emissão das ações que subscreveu ou adquiriu (art. 1º).", "Companhia aberta: valores mobiliários negociados em bolsa ou balcão, fiscalizada pela CVM. Fechada: não.", "Sempre empresária, qualquer que seja o objeto (art. 2º, §1º)."], "txt": "Na <b>sociedade anônima (S/A)<\/b>, também chamada de <b>companhia<\/b>, o capital é dividido em <b>ações<\/b>. O acionista responde <b>apenas pelo preço de emissão<\/b> das ações que subscreveu ou comprou (art. 1º). Se já pagou tudo, não deve mais nada.\n<b>Sempre empresária:<\/b> mesmo que o objeto seja não empresarial, a S/A é empresária e se rege pelas leis e usos do comércio (art. 2º, §1º).\n<b>Aberta x fechada (art. 4º):<\/b>\n<b>Aberta:<\/b> seus valores mobiliários (ações, debêntures) são <b>admitidos à negociação<\/b> no mercado de valores mobiliários (bolsa ou balcão). Precisa de registro na <b>CVM<\/b>, a Comissão de Valores Mobiliários, que a fiscaliza.\n<b>Fechada:<\/b> não tem ações negociadas no mercado. É a mais comum em empresas familiares.\n<b>Nome (art. 3º):<\/b> a companhia tem <b>denominação<\/b> (nome) seguida de 'companhia' ou 'S/A' (palavra 'companhia' no começo ou meio e 'S/A' no final, ou 'sociedade anônima' por extenso).\n<b>Constituição (art. 80):<\/b> pelo menos <b>duas pessoas<\/b> (exceção: a subsidiária integral, que tem um só acionista, uma sociedade brasileira, art. 251), com no mínimo <b>10% do preço de emissão em dinheiro<\/b> e depósito em banco."}, {"id": "41", "t": "Ações: ordinárias, preferenciais e de fruição", "q": ["Ordinárias: dão direito de voto. Preferenciais: vantagens patrimoniais, em geral sem voto ou com voto restrito.", "Preferenciais sem voto: até 50% do total de ações emitidas (art. 15, §2º).", "Ações de fruição: dadas a quem teve a ação amortizada (art. 44, §5º)."], "txt": "<b>Ordinárias (art. 15):<\/b> são as comuns. Dão <b>direito de voto<\/b> e participação nos lucros.\n<b>Preferenciais:<\/b> dão vantagens, em regra <b>patrimoniais<\/b> (prioridade no dividendo ou no reembolso do capital), em troca do voto, que é suprimido ou restringido (art. 17). O número de preferenciais sem voto ou com voto restrito <b>não pode passar de 50%<\/b> do total das ações emitidas (art. 15, §2º).\n<b>De fruição (art. 15, 'caput'):<\/b> entregues aos acionistas cujas ações foram integralmente <b>amortizadas<\/b> (devolução antecipada do valor), para que continuem participando dos lucros remanescentes.\n<b>Preferenciais na prática:<\/b> se a empresa não pagar dividendos fixos ou mínimos por <b>três exercícios consecutivos<\/b>, as preferenciais sem voto <b>adquirem voto<\/b> até pagar (art. 111, §1º).\n<b>Voto plural (Lei 14.195/2021):<\/b> é permitida a criação de classes de ações ordinárias com <b>voto plural<\/b> (até <b>10 votos por ação<\/b>) na companhia fechada, e na aberta, nas condições do art. 110-A.\n<b>Ações com e sem valor nominal (art. 11):<\/b> o estatuto diz se as ações têm valor nominal ou não.\n<b>Forma:<\/b> as ações são sempre <b>nominativas<\/b> (art. 20)."}, {"id": "42", "t": "Assembleia geral: tipos, quórum e matérias", "q": ["AGO: nos 4 primeiros meses após o fim do exercício (art. 132); AGE: qualquer outra matéria.", "Instalação: 1ª convocação, ao menos 1/4 do capital com voto; 2ª, qualquer número (art. 125). Para reforma do estatuto: 2/3 na 1ª (art. 135).", "Deliberação: maioria absoluta dos votos presentes, sem contar os em branco (art. 129)."], "txt": "A <b>assembleia geral<\/b> é o órgão máximo da S/A. Ela decide o que é de interesse da companhia (art. 121).\n<b>Assembleia geral ordinária (AGO, art. 132):<\/b> acontece <b>uma vez por ano, nos 4 primeiros meses<\/b> depois do fim do exercício. Trata de: contas dos administradores, demonstrações financeiras, destinação do lucro e eleição de administradores e fiscais.\n<b>Extraordinária (AGE):<\/b> para todo o resto, como a <b>reforma do estatuto<\/b>.\n<b>Quórum de instalação (art. 125):<\/b> na 1ª convocação, acionistas que representem ao menos <b>1/4 do capital com direito a voto<\/b>; na 2ª, <b>qualquer número<\/b>. Para <b>reforma do estatuto<\/b> (art. 135): <b>2/3<\/b> do capital votante na 1ª convocação, qualquer número na 2ª.\n<b>Quórum de deliberação (art. 129):<\/b> <b>maioria absoluta dos votos<\/b> dos presentes, <b>não se computando os votos em branco<\/b>.\n<b>Quórum qualificado (art. 136):<\/b> aprovação de <b>metade, no mínimo, das ações com direito a voto<\/b> para matérias graves: criar preferenciais, fusão, incorporação, cisão, participação em grupo de sociedades, mudança do objeto, dissolução.\n<b>Convocação (art. 124):<\/b> por anúncios publicados <b>pelo menos 3 vezes<\/b>. Companhia <b>fechada<\/b>: 8 dias de antecedência na 1ª convocação e 5 na 2ª. Companhia <b>aberta<\/b>: 15 dias na 1ª e 8 na 2ª. Se todos os acionistas comparecerem, a assembleia vale mesmo sem convocação (§4º)."}, {"id": "43", "t": "Administração: conselho de administração e diretoria", "q": ["Conselho de administração: obrigatório nas companhias abertas, de capital autorizado e de economia mista; mínimo 3 membros, mandato de até 3 anos (arts. 138 e 140).", "Diretoria: 2 ou mais diretores, eleitos pelo conselho (ou pela assembleia, se não houver conselho), mandato de até 3 anos (art. 143).", "Só pessoas naturais; diretores residem no País (art. 146)."], "txt": "A S/A é administrada por <b>dois órgãos<\/b> (art. 138): o <b>conselho de administração<\/b> (que decide e orienta) e a <b>diretoria<\/b> (que executa e representa a companhia). Ou, quando o conselho não é obrigatório, só a diretoria.\n<b>Conselho de administração (arts. 138 a 142):<\/b> <b>obrigatório<\/b> nas <b>companhias abertas<\/b>, nas de <b>capital autorizado<\/b> e nas <b>de economia mista<\/b>. Composto por <b>no mínimo 3 membros<\/b>, eleitos pela assembleia e destituíveis por ela a qualquer tempo, com mandato de até <b>3 anos<\/b>. É um órgão <b>deliberativo<\/b>. Fixa a orientação geral dos negócios, elege e destitui os diretores e fiscaliza a gestão.\n<b>Diretoria (arts. 143 a 145):<\/b> <b>2 ou mais<\/b> membros, eleitos e destituíveis a qualquer tempo pelo conselho (ou pela assembleia). Mandato de até <b>3 anos<\/b>. Até <b>1/3<\/b> dos membros do conselho pode ser eleito para a diretoria. Quem <b>representa<\/b> a companhia e pratica os atos de gestão é a diretoria.\n<b>Requisitos (art. 146):<\/b> só <b>pessoas naturais<\/b>, residentes no País (diretores). Os conselheiros não precisam ser acionistas desde a Lei 12.431/2011.\n<b>Garantia de gestão:<\/b> o administrador precisa tomar posse e dar caução se o estatuto exigir."}, {"id": "44", "t": "Deveres e responsabilidade dos administradores", "q": ["Deveres: diligência (art. 153), lealdade (art. 155), informar (art. 157), e não agir em conflito de interesses (art. 156).", "Não responde por atos ilícitos de outros administradores, salvo conivência ou negligência (art. 158, §1º).", "Responde civilmente se agir com culpa ou dolo, ou com violação da lei ou do estatuto (art. 158)."], "txt": "O administrador cuida de dinheiro alheio, e por isso a lei cobra <b>padrão elevado<\/b>:\n<b>Dever de diligência (art. 153):<\/b> cuidar da companhia como um homem 'ativo e probo' cuida dos seus próprios negócios.\n<b>Finalidade (art. 154):<\/b> exercer as atribuições para lograr os fins da companhia e do interesse público, atendendo às exigências do bem público e da função social da empresa.\n<b>Dever de lealdade (art. 155):<\/b> guardar sigilo, não usar em proveito próprio oportunidades da companhia e não usar <b>informação privilegiada<\/b>.\n<b>Conflito de interesses (art. 156):<\/b> é <b>proibido<\/b> intervir em operação em que tenha interesse conflitante; deve comunicar e abster-se.\n<b>Dever de informar (art. 157):<\/b> nas companhias abertas, deve revelar a participação acionária e comunicar fato relevante.\n<b>Responsabilidade (art. 158):<\/b> o administrador <b>não responde pessoalmente<\/b> pelas obrigações que contrair em nome da companhia e em virtude de ato regular de gestão. Responde civilmente pelos prejuízos que causar quando proceder <b>com culpa ou dolo<\/b>, <b>ou com violação da lei ou do estatuto<\/b>.\n<b>Ação de responsabilidade (art. 159):<\/b> depende de deliberação da assembleia; se não proposta em 3 meses, qualquer acionista pode propor. Prescreve em <b>3 anos<\/b> (art. 287, II, b)."}, {"id": "45", "t": "Acionista controlador e abuso de poder", "q": ["Controlador: titular de direitos de sócio que lhe assegurem a maioria dos votos nas deliberações e o poder de eleger a maioria dos administradores, e que usa esse poder de fato (art. 116).", "Deve usar o poder para fazer a companhia realizar seu objeto e cumprir sua função social (art. 116, parágrafo único).", "Responde pelos danos causados por atos com abuso de poder (art. 117)."], "txt": "<b>Controlador (art. 116):<\/b> pessoa (ou grupo vinculado por acordo de voto) que <b>detém direitos de sócio que lhe assegurem, de modo permanente, a maioria dos votos<\/b> nas deliberações da assembleia e o poder de <b>eleger a maioria dos administradores<\/b>; e <b>usa efetivamente<\/b> esse poder para dirigir as atividades sociais.\n<b>Deveres (art. 116, parágrafo único):<\/b> usar o poder para fazer a companhia realizar o seu objeto e cumprir sua função social, e tem deveres e responsabilidades para com os demais acionistas, os que nela trabalham e a comunidade.\n<b>Abuso de poder (art. 117):<\/b> o controlador responde pelos danos causados por atos praticados com abuso de poder. Exemplos do §1º: orientar a companhia para fim estranho ao objeto social ou lesivo ao interesse nacional; promover liquidação de companhia próspera; promover alteração do estatuto, emissão de valores mobiliários ou adoção de políticas de gestão que visem a beneficiá-lo em prejuízo da companhia; eleger administrador ou fiscal que sabe inapto; induzir ou tentar induzir administrador a praticar ato ilegal.\n<b>Cuidado:<\/b> o acionista controlador também responde quando <b>exerce<\/b> cargo de administrador (art. 117, §3º): ele fica sujeito aos deveres e responsabilidades do cargo."}, {"id": "46", "t": "Conselho fiscal, dividendos e reservas", "q": ["Conselho fiscal: obrigatório existir, mas funcionamento facultativo (art. 161). 3 a 5 membros.", "Dividendo obrigatório: se o estatuto for omisso, metade do lucro líquido ajustado (art. 202). Se a regra for introduzida depois, o mínimo é 25% (§2º).", "Reserva legal: 5% do lucro líquido, até 20% do capital social (art. 193)."], "txt": "<b>Conselho fiscal (arts. 161 a 165):<\/b> a S/A <b>deve prever<\/b> o conselho fiscal no estatuto, mas ele só <b>funciona<\/b> nos exercícios em que for instalado a pedido de acionistas (permanente ou não). Tem de <b>3 a 5<\/b> membros, acionistas ou não, eleitos pela assembleia. Fiscaliza os atos dos administradores.\n<b>Lucro:<\/b> do lucro do exercício, tira-se prejuízos acumulados e o imposto de renda. Depois (art. 193) vai para a <b>reserva legal<\/b>: <b>5%<\/b> do lucro líquido, que só vale até que a reserva atinja <b>20% do capital social<\/b>.\n<b>Dividendo obrigatório (art. 202):<\/b> os acionistas têm direito de receber, em cada exercício, a parcela dos lucros que o estatuto estabelecer. Se o estatuto for <b>omisso<\/b>, o mínimo é <b>metade do lucro líquido ajustado<\/b>. Se o estatuto era omisso e a assembleia o altera depois para criar a regra, o dividendo obrigatório não pode ser inferior a <b>25%<\/b> do lucro líquido ajustado (§2º).\n<b>Pagamento:<\/b> o dividendo deve ser pago no prazo de 60 dias da data em que for declarado, e no mesmo exercício (art. 205, §3º).\n<b>Cuidado:<\/b> se a administração informar que o pagamento é incompatível com a situação financeira, o dividendo obrigatório não é pago no exercício (art. 202, §4º), e o lucro fica em reserva especial."}, {"id": "47", "t": "Direito de retirada e direitos essenciais do acionista", "q": ["Direitos essenciais (art. 109): participar dos lucros, do acervo na liquidação, fiscalizar, preferência na subscrição e retirar-se nos casos legais.", "Retirada (art. 137): dissidente de certas deliberações (fusão, incorporação, mudança do objeto etc.) recebe o valor de suas ações.", "Prazo: 30 dias da publicação da ata."], "txt": "Alguns direitos do acionista <b>não podem ser tirados nem pelo estatuto nem pela assembleia<\/b> (art. 109). São os <b>direitos essenciais<\/b>:\n<b>I)<\/b> participar dos <b>lucros<\/b>;\n<b>II)<\/b> participar do <b>acervo<\/b> da companhia, em caso de liquidação;\n<b>III)<\/b> <b>fiscalizar<\/b> a gestão dos negócios sociais;\n<b>IV)<\/b> <b>preferência<\/b> para subscrição de ações, debêntures conversíveis e bônus de subscrição (art. 171);\n<b>V)<\/b> <b>retirar-se<\/b> da sociedade nos casos previstos em lei (art. 137).\n<b>Retirada (recesso, art. 137):<\/b> o acionista que <b>discorda<\/b> de certas decisões (fusão, incorporação, cisão em algumas hipóteses, mudança do objeto social, criação de ações preferenciais, participação em grupo de sociedades, entre outras) pode <b>sair<\/b> e receber o <b>valor de reembolso<\/b> das ações. Prazo: <b>30 dias<\/b> da publicação da ata. Só tem esse direito quem <b>era titular<\/b> das ações na data da primeira publicação do edital de convocação, ou quando da comunicação do fato relevante, e dissentiu, se absteve ou não compareceu.\n<b>Reembolso:<\/b> pelo valor patrimonial (do último balanço aprovado), salvo se o estatuto fixar outro critério. Se o balanço for anterior a mais de 60 dias, o acionista pode pedir novo levantamento."}, {"id": "48", "t": "Debêntures, bônus e outros valores mobiliários", "q": ["Debênture: título de dívida da companhia. O debenturista é credor, e não sócio (art. 52).", "Emitida por escritura de emissão, com agente fiduciário (art. 61).", "Também: partes beneficiárias (art. 46), bônus de subscrição (art. 75
